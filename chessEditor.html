                    rebuildAllPieces();
                    pushHistory();
                });

                bindRange(`roughness_${type}`, (v) => { params.roughness = v; rebuildAllPieces(); });
                bindRange(`metalness_${type}`, (v) => { params.metalness = v; rebuildAllPieces(); });

                const updatePiecePos = () => {
                    params.position = {
                        x: getRangeVal(`posX_${type}`, 0),
                        y: getRangeVal(`posY_${type}`, 0),
                        z: getRangeVal(`posZ_${type}`, 0)
                    };
                    const g = pieceGroups[type];
                    if (g) g.position.set(params.position.x, params.position.y, params.position.z);
                };
                bindRange(`posX_${type}`, updatePiecePos);
                bindRange(`posY_${type}`, updatePiecePos);
                bindRange(`posZ_${type}`, updatePiecePos);

                const updatePart = () => {
                    if (!selectedPart || selectedPart.type !== type) return;
                    const mesh = getPartMesh(type, selectedPart.partId);
                    if (!mesh) return;

                    mesh.position.set(
                        getRangeVal(`partX_${type}`, 0),
                        getRangeVal(`partY_${type}`, 0),
                        getRangeVal(`partZ_${type}`, 0)
                    );
                    mesh.rotation.set(
                        getRangeVal(`partRX_${type}`, 0),
                        getRangeVal(`partRY_${type}`, 0),
                        getRangeVal(`partRZ_${type}`, 0)
                    );
                    mesh.scale.set(
                        getRangeVal(`partSX_${type}`, 1),
                        getRangeVal(`partSY_${type}`, 1),
                        getRangeVal(`partSZ_${type}`, 1)
                    );
                    writePartTransform(type, selectedPart.partId, mesh);
                    if (mesh.userData.isAir) syncAirOutline(mesh);

                    if (highlightBoxHelper && highlightMeshRef === mesh) highlightBoxHelper.update();

                    const group = pieceGroups[type];
                    if (pieceHasAir(group)) {
                        scheduleCSGRebuild();
                    }
                };

                ['partX', 'partY', 'partZ', 'partRX', 'partRY', 'partRZ', 'partSX', 'partSY', 'partSZ']
                    .forEach(prefix => bindRange(`${prefix}_${type}`, updatePart));

                document.getElementById(`partControls_${type}`).style.display = 'none';
            }

            setGizmoMode('translate');
        }

        // ============================================================
        //  7. 部件選擇與管理
        // ============================================================
        function getPartMesh(type, partId) {
            const group = pieceGroups[type];
            if (!group || !group.userData || !group.userData.parts) return null;
            return group.userData.parts[partId] || null;
        }

        function highlightPart(type, partId) {
            if (highlightBoxHelper) {
                scene.remove(highlightBoxHelper);
                if (highlightBoxHelper.geometry) highlightBoxHelper.geometry.dispose();
                highlightBoxHelper = null;
            }

            if (highlightMeshRef && highlightMeshRef.material && highlightMeshRef.material.emissive) {
                highlightMeshRef.material.emissiveIntensity = 0;
            }

            // ★ 隱藏上一個空氣塊（本體 + 輪廓）
            if (highlightMeshRef && highlightMeshRef.userData && highlightMeshRef.userData.isAir) {
                highlightMeshRef.visible = false;
                if (highlightMeshRef.userData.airOutline) {
                    highlightMeshRef.userData.airOutline.visible = false;
                }
            }

            highlightMeshRef = null;

            if (!type || !partId) return;

            const mesh = getPartMesh(type, partId);
            if (!mesh) return;

            highlightMeshRef = mesh;

            // ★ 選中空氣塊時才顯示本體 + 輪廓
            if (mesh.userData.isAir) {
                mesh.visible = true;
                if (mesh.userData.airOutline) {
                    mesh.userData.airOutline.visible = true;
                }
            }

            highlightBoxHelper = new THREE.BoxHelper(mesh, 0xe8c547);
            highlightBoxHelper.material.depthTest = false;
            highlightBoxHelper.material.transparent = true;
            highlightBoxHelper.material.opacity = 0.8;
            highlightBoxHelper.renderOrder = 1000;
            scene.add(highlightBoxHelper);
        }

        function selectPart(type, partId) {
            if (selectedPart && selectedPart.type === type && selectedPart.partId === partId) {
                selectedPart = null;
            } else {
                selectedPart = type && partId ? { type, partId } : null;
            }

            for (const t of PIECE_TYPES) {
                const ctrl = document.getElementById(`partControls_${t}`);
                const nameEl = document.getElementById(`selectedPartName_${t}`);
                if (ctrl) {
                    if (selectedPart && selectedPart.type === t) {
                        ctrl.style.display = 'block';
                        const mesh = getPartMesh(t, selectedPart.partId);
                        if (nameEl) {
                            nameEl.textContent = (mesh && mesh.userData.partName) || selectedPart.partId;
                        }
                    } else {
                        ctrl.style.display = 'none';
                    }
                }
            }

            if (selectedPart) {
                syncPartInputs(selectedPart.type);
                highlightPart(selectedPart.type, selectedPart.partId);
            } else {
                highlightPart(null, null);
            }

            attachGizmo();
            updatePartsListUI();
        }

        function updatePartsListUI() {
            for (const type of PIECE_TYPES) {
                const listContainer = document.getElementById(`partsList_${type}`);
                if (!listContainer) continue;
                listContainer.innerHTML = '';

                const group = pieceGroups[type];
                if (!group || !group.userData.parts) continue;

                const parts = group.userData.parts;
                for (const [partId, mesh] of Object.entries(parts)) {
                    const isAir = mesh.userData.isAir;
                    const isSelected = selectedPart && selectedPart.type === type && selectedPart.partId === partId;
                    const tag = document.createElement('div');
                    tag.className = `part-tag${isAir ? ' air-tag' : ''}${isSelected ? ' active' : ''}`;

                    const nameSpan = document.createElement('span');
                    nameSpan.textContent = mesh.userData.partName || partId;
                    nameSpan.onclick = () => selectPart(type, partId);
                    tag.appendChild(nameSpan);

                    const cloneBtn = document.createElement('span');
                    cloneBtn.className = 'clone-part';
                    cloneBtn.innerHTML = '❐';
                    cloneBtn.title = '複製部件';
                    cloneBtn.onclick = (e) => {
                        e.stopPropagation();
                        clonePart(type, partId);
                    };
                    tag.appendChild(cloneBtn);

                    const renameBtn = document.createElement('span');
                    renameBtn.className = 'rename-part';
                    renameBtn.innerHTML = '✏';
                    renameBtn.title = '重新命名';
                    renameBtn.onclick = (e) => {
                        e.stopPropagation();
                        renamePart(type, partId);
                    };
                    tag.appendChild(renameBtn);

                    const delBtn = document.createElement('span');
                    delBtn.className = 'del-part';
                    delBtn.innerHTML = '✕';
                    delBtn.title = '刪除部件';
                    delBtn.onclick = (e) => {
                        e.stopPropagation();
                        deletePart(type, partId);
                    };
                    tag.appendChild(delBtn);

                    listContainer.appendChild(tag);
                }
            }
        }

        function addPartToPiece(type) {
            const select = document.getElementById(`addPartType_${type}`);
            if (!select) return;
            const partType = select.value;
            const newId = `custom_${partIdCounter++}`;

            const params = currentParams[type];
            if (!params.parts) params.parts = {};

            const isAir = partType === 'air';
            const defaultName = isAir ? 'Air Cut' : (partType.charAt(0).toUpperCase() + partType.slice(1));

            params.parts[newId] = {
                type: partType,
                name: defaultName,
                geometryParams: isAir ? { width: 0.3, height: 0.3, depth: 0.3 } : {},
                roughness: 0.5,
                metalness: 0.2,
                position: { x: 0, y: 0.5, z: 0 },
                rotation: { x: 0, y: 0, z: 0 },
                scale: { x: 1, y: 1, z: 1 }
            };

            rebuildSinglePiece(type);
            selectPart(type, newId);
            pushHistory();
        }

        function deletePart(type, partId) {
            const params = currentParams[type];
            if (!params || !params.parts) return;

            if (BUILTIN_PART_IDS.includes(partId)) {
                params.parts[partId] = params.parts[partId] || {};
                params.parts[partId].deleted = true;
            } else {
                delete params.parts[partId];
            }

            if (selectedPart && selectedPart.type === type && selectedPart.partId === partId) {
                selectPart(null, null);
            }

            rebuildSinglePiece(type);
            pushHistory();
        }

        function clonePart(type, partId) {
            const params = currentParams[type];
            if (!params || !params.parts) return;

            const source = params.parts[partId];
            const newId = `custom_${partIdCounter++}`;

            let clonedData;
            if (source) {
                clonedData = JSON.parse(JSON.stringify(source));
                clonedData.name = (source.name || 'Component') + ' Copy';
                if (clonedData.position) clonedData.position.x += 0.05;
            } else {
                const mesh = getPartMesh(type, partId);
                clonedData = {
                    type: 'box',
                    name: partId + ' Copy',
                    roughness: params.roughness || 0.5,
                    metalness: params.metalness || 0.2,
                    position: mesh ? { x: mesh.position.x + 0.05, y: mesh.position.y, z: mesh.position.z } : { x: 0.05, y: 0.5, z: 0 },
                    rotation: mesh ? { x: mesh.rotation.x, y: mesh.rotation.y, z: mesh.rotation.z } : { x: 0, y: 0, z: 0 },
                    scale: mesh ? { x: mesh.scale.x, y: mesh.scale.y, z: mesh.scale.z } : { x: 1, y: 1, z: 1 }
                };
            }

            delete clonedData.deleted;
            params.parts[newId] = clonedData;

            rebuildSinglePiece(type);
            selectPart(type, newId);
            pushHistory();
        }

        function renamePart(type, partId) {
            const mesh = getPartMesh(type, partId);
            const currentName = (mesh && mesh.userData.partName) || partId;
            const newName = prompt('請輸入部件新名稱:', currentName);
            if (newName && newName.trim()) {
                const params = currentParams[type];
                if (!params.parts) params.parts = {};
                if (!params.parts[partId]) params.parts[partId] = {};
                params.parts[partId].name = newName.trim();
                if (mesh) mesh.userData.partName = newName.trim();
                updatePartsListUI();
                if (selectedPart && selectedPart.type === type && selectedPart.partId === partId) {
                    const nameEl = document.getElementById(`selectedPartName_${type}`);
                    if (nameEl) nameEl.textContent = newName.trim();
                }
                pushHistory();
            }
        }

        // ============================================================
        //  8. 位置與全域動作
        // ============================================================
        function resetAllPositions() {
            const defaultPositions = {
                pawn: { x: -4.2, y: 0, z: 0 },
                rook: { x: -2.52, y: 0.02, z: 0 },
                knight: { x: -0.84, y: 0.02, z: 0 },
                bishop: { x: 0.84, y: 0.02, z: 0 },
                queen: { x: 2.52, y: 0.03, z: 0 },
                king: { x: 4.2, y: 0.04, z: 0 }
            };
            for (const type of PIECE_TYPES) {
                currentParams[type].position = { ...defaultPositions[type] };
                const rangeX = document.getElementById(`posX_${type}`);
                const rangeY = document.getElementById(`posY_${type}`);
                const rangeZ = document.getElementById(`posZ_${type}`);
                if (rangeX) rangeX.value = defaultPositions[type].x;
                if (rangeY) rangeY.value = defaultPositions[type].y;
                if (rangeZ) rangeZ.value = defaultPositions[type].z;

                const numX = document.getElementById(`posX_${type}_num`);
                const numY = document.getElementById(`posY_${type}_num`);
                const numZ = document.getElementById(`posZ_${type}_num`);
                if (numX) numX.value = defaultPositions[type].x.toFixed(2);
                if (numY) numY.value = defaultPositions[type].y.toFixed(2);
                if (numZ) numZ.value = defaultPositions[type].z.toFixed(2);

                if (pieceGroups[type]) {
                    pieceGroups[type].position.set(defaultPositions[type].x, defaultPositions[type].y, defaultPositions[type].z);
                }
            }
            pushHistory();
        }

        function arrangeInRow() {
            const spacing = 1.6;
            const startX = -((PIECE_TYPES.length - 1) * spacing) / 2;
            PIECE_TYPES.forEach((type, idx) => {
                const nx = startX + idx * spacing;
                currentParams[type].position = { x: nx, y: 0, z: 0 };
                const rangeX = document.getElementById(`posX_${type}`);
                const rangeY = document.getElementById(`posY_${type}`);
                const rangeZ = document.getElementById(`posZ_${type}`);
                if (rangeX) rangeX.value = nx;
                if (rangeY) rangeY.value = 0;
                if (rangeZ) rangeZ.value = 0;

                const numX = document.getElementById(`posX_${type}_num`);
                const numY = document.getElementById(`posY_${type}_num`);
                const numZ = document.getElementById(`posZ_${type}_num`);
                if (numX) numX.value = nx.toFixed(2);
                if (numY) numY.value = (0).toFixed(2);
                if (numZ) numZ.value = (0).toFixed(2);

                if (pieceGroups[type]) pieceGroups[type].position.set(nx, 0, 0);
            });
            pushHistory();
        }

        function randomizePositions() {
            PIECE_TYPES.forEach(type => {
                const rx = (Math.random() - 0.5) * 8;
                const rz = (Math.random() - 0.5) * 4;
                currentParams[type].position = { x: rx, y: 0, z: rz };
                const rangeX = document.getElementById(`posX_${type}`);
                const rangeZ = document.getElementById(`posZ_${type}`);
                if (rangeX) rangeX.value = rx;
                if (rangeZ) rangeZ.value = rz;

                const numX = document.getElementById(`posX_${type}_num`);
                const numZ = document.getElementById(`posZ_${type}_num`);
                if (numX) numX.value = rx.toFixed(2);
                if (numZ) numZ.value = rz.toFixed(2);

                if (pieceGroups[type]) pieceGroups[type].position.set(rx, 0, rz);
            });
            pushHistory();
        }

        function resetPiece(type) {
            currentParams[type] = JSON.parse(JSON.stringify(DEFAULT_PARAMS[type]));
            if (selectedPart && selectedPart.type === type) selectPart(null, null);
            buildPanel();
            rebuildSinglePiece(type);
            pushHistory();
            showToast(`已重置 ${PIECE_NAMES[type]}`);
        }

        function resetAll() {
            currentParams = JSON.parse(JSON.stringify(DEFAULT_PARAMS));
            selectPart(null, null);
            buildPanel();
            rebuildAllPieces();
            pushHistory();
            showToast('已全部重置');
        }

        // ============================================================
        //  9. 歷史紀錄 (撤銷/重做)
        // ============================================================
        const historyStack = [];
        let historyIndex = -1;
        const MAX_HISTORY = 30;

        function pushHistory() {
            const state = JSON.stringify(currentParams);
            if (historyIndex >= 0 && historyStack[historyIndex] === state) return;

            historyStack.splice(historyIndex + 1);
            historyStack.push(state);
            if (historyStack.length > MAX_HISTORY) historyStack.shift();
            else historyIndex++;

            updateUndoRedoButtons();
        }

        function undo() {
            if (historyIndex > 0) {
                historyIndex--;
                currentParams = JSON.parse(historyStack[historyIndex]);
                buildPanel();
                rebuildAllPieces();
                updateUndoRedoButtons();
                showToast('↶ 撤銷');
            }
        }

        function redo() {
            if (historyIndex < historyStack.length - 1) {
                historyIndex++;
                currentParams = JSON.parse(historyStack[historyIndex]);
                buildPanel();
                rebuildAllPieces();
                updateUndoRedoButtons();
                showToast('↷ 重做');
            }
        }

        function updateUndoRedoButtons() {
            const undoBtn = document.getElementById('undoBtn');
            const redoBtn = document.getElementById('redoBtn');
            if (undoBtn) undoBtn.disabled = historyIndex <= 0;
            if (redoBtn) redoBtn.disabled = historyIndex >= historyStack.length - 1;
        }

        // ============================================================
        //  10. 匯出/匯入/Toast
        // ============================================================
        function exportCode() {
            const code = `const PIECE_PARAMS = ${JSON.stringify(currentParams, null, 2)};`;
            document.getElementById('exportCodeArea').value = code;
            document.getElementById('exportModal').classList.add('open');
        }

        function closeExport() {
            document.getElementById('exportModal').classList.remove('open');
        }

        function copyExport() {
            const area = document.getElementById('exportCodeArea');
            area.select();
            navigator.clipboard.writeText(area.value).then(() => {
                showToast('📋 已複製代碼！');
                closeExport();
            }).catch(() => {
                document.execCommand('copy');
                showToast('📋 已複製代碼！');
                closeExport();
            });
        }

        function openImportModal() {
            document.getElementById('importCodeArea').value = '';
            document.getElementById('importModal').classList.add('open');
        }

        function closeImport() {
            document.getElementById('importModal').classList.remove('open');
        }

        function doImport() {
            let raw = document.getElementById('importCodeArea').value.trim();
            if (!raw) return;

            if (raw.startsWith('const PIECE_PARAMS =')) {
                raw = raw.replace(/^const PIECE_PARAMS =\s*/, '').replace(/;$/, '');
            }

            try {
                const parsed = JSON.parse(raw);
                currentParams = parsed;
                selectPart(null, null);
                buildPanel();
                rebuildAllPieces();
                pushHistory();
                closeImport();
                showToast('📥 匯入成功！');
            } catch (err) {
                alert('JSON 解析失敗，請檢查格式是否正確！\n' + err.message);
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('copyToast');
            if (!toast) return;
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // ============================================================
        //  11. 3D Raycasting & 快捷鍵綁定
        // ============================================================
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        container.addEventListener('pointerdown', (e) => {
            if (e.button !== 0) return;

            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

            if (transformControls && transformControls.dragging) return;

            raycaster.setFromCamera(mouse, camera);

            const meshes = [];
            for (const [type, group] of Object.entries(pieceGroups)) {
                if (!group) continue;
                group.traverse(child => {
                    if (child.isMesh && child.userData && child.userData.partKey) {
                        meshes.push(child);
                    }
                });
            }

            const intersects = raycaster.intersectObjects(meshes, false);
            if (intersects.length > 0) {
                const hit = intersects[0].object;
                const partKey = hit.userData.partKey;

                for (const [type, group] of Object.entries(pieceGroups)) {
                    if (!group) continue;
                    let current = hit;
                    while (current && current !== group && current.parent) {
                        current = current.parent;
                    }
                    if (current === group) {
                        const item = document.querySelector(`.accordion-item[data-type="${type}"]`);
                        if (item && !item.classList.contains('active')) {
                            document.querySelectorAll('.accordion-item').forEach(el => el.classList.remove('active'));
                            item.classList.add('active');
                        }
                        selectPart(type, partKey);
                        break;
                    }
                }
            }
        });

        window.addEventListener('keydown', (e) => {
            const tag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
            if (tag === 'input' || tag === 'textarea' || tag === 'select') return;

            if (e.ctrlKey || e.metaKey) {
                if (e.key.toLowerCase() === 'z') {
                    e.preventDefault();
                    if (e.shiftKey) redo();
                    else undo();
                } else if (e.key.toLowerCase() === 'y') {
                    e.preventDefault();
                    redo();
                }
                return;
            }

            switch (e.key.toLowerCase()) {
                case 'g':
                    setGizmoMode('translate');
                    break;
                case 'r':
                    setGizmoMode('rotate');
                    break;
                case 's':
                    setGizmoMode('scale');
                    break;
                case 'delete':
                case 'backspace':
                    if (selectedPart) {
                        deletePart(selectedPart.type, selectedPart.partId);
                    }
                    break;
                case 'escape':
                    selectPart(null, null);
                    break;
            }
        });

        // ============================================================
        //  12. 初始化啟動
        // ============================================================
        window.addEventListener('DOMContentLoaded', () => {
            initScene();
            initTransformControls();
            buildPanel();
            rebuildAllPieces();
            pushHistory();
        });
    </script>
</body>
