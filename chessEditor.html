<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>♟ 棋子模型編輯器（部件級）</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            background: #1a1a2e;
            color: #f0e6d3;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a2e;
        }

        ::-webkit-scrollbar-thumb {
            background: #e8c547;
            border-radius: 4px;
        }

        #topBar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 24px;
            background: rgba(22, 33, 62, 0.92);
            backdrop-filter: blur(6px);
            border-bottom: 2px solid #e8c547;
            z-index: 20;
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 8px;
        }

        #topBar h1 {
            font-size: 1.3rem;
            color: #e8c547;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #topBar h1 small {
            font-size: 0.7rem;
            opacity: 0.6;
            font-weight: 400;
            letter-spacing: 0;
        }

        .top-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            background: #e8c547;
            color: #1a1a2e;
            box-shadow: 0 2px 10px rgba(232, 197, 71, 0.25);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 18px rgba(232, 197, 71, 0.4);
        }

        .btn-secondary {
            background: #3a3a5c;
            color: #f0e6d3;
            box-shadow: none;
        }

        .btn-secondary:hover {
            background: #4a4a6c;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.3);
        }

        .btn-danger {
            background: #e74c3c;
            color: #fff;
            box-shadow: 0 2px 10px rgba(231, 76, 60, 0.25);
        }

        .btn-danger:hover {
            background: #ff6b5e;
            box-shadow: 0 4px 18px rgba(231, 76, 60, 0.4);
        }

        .btn-success {
            background: #2ecc71;
            color: #1a1a2e;
            box-shadow: 0 2px 10px rgba(46, 204, 113, 0.25);
        }

        .btn-success:hover {
            background: #55ef9a;
            box-shadow: 0 4px 18px rgba(46, 204, 113, 0.4);
        }

        .btn-warning {
            background: #f39c12;
            color: #1a1a2e;
            box-shadow: 0 2px 10px rgba(243, 156, 18, 0.25);
        }

        .btn-warning:hover {
            background: #f1c40f;
            box-shadow: 0 4px 18px rgba(243, 156, 18, 0.4);
        }

        .btn-sm {
            padding: 4px 12px;
            font-size: 0.7rem;
        }

        #main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        #sceneContainer {
            flex: 1;
            position: relative;
            background: #12121f;
            overflow: hidden;
            min-width: 0;
        }

        #sceneContainer canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        #sceneHint {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: #aaa;
            pointer-events: none;
            white-space: nowrap;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        #panel {
            width: 420px;
            min-width: 340px;
            max-width: 500px;
            background: rgba(22, 33, 62, 0.95);
            backdrop-filter: blur(6px);
            border-left: 2px solid #e8c547;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
        }

        #panelHeader {
            padding: 14px 20px 10px;
            border-bottom: 1px solid rgba(232, 197, 71, 0.2);
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #panelHeader h2 {
            font-size: 1rem;
            color: #e8c547;
            letter-spacing: 1px;
        }

        #panelHeader .badge {
            font-size: 0.65rem;
            background: rgba(232, 197, 71, 0.15);
            padding: 2px 12px;
            border-radius: 12px;
            color: #e8c547;
        }

        #panelBody {
            flex: 1;
            overflow-y: auto;
            padding: 8px 16px 24px;
        }

        /* 摺疊面板 */
        .accordion-item {
            margin: 6px 0;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            overflow: hidden;
            transition: border-color 0.2s;
        }

        .accordion-item.active {
            border-color: rgba(232, 197, 71, 0.5);
            box-shadow: 0 0 20px rgba(232, 197, 71, 0.05);
        }

        .accordion-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            cursor: pointer;
            user-select: none;
            transition: background 0.15s;
            gap: 12px;
        }

        .accordion-header:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .accordion-header .piece-icon {
            font-size: 1.4rem;
            width: 32px;
            text-align: center;
        }

        .accordion-header .piece-name {
            font-weight: 700;
            font-size: 0.95rem;
            flex: 1;
        }

        .accordion-header .piece-color-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
        }

        .accordion-header .arrow {
            transition: transform 0.25s;
            font-size: 0.7rem;
            opacity: 0.5;
        }

        .accordion-item.active .accordion-header .arrow {
            transform: rotate(180deg);
        }

        .accordion-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease;
            padding: 0 16px;
        }

        .accordion-item.active .accordion-body {
            max-height: 2000px;
            padding: 0 16px 16px;
            overflow-y: auto;
        }

        /* 參數控制 */
        .param-group {
            margin: 8px 0 4px;
        }

        .param-group .param-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            opacity: 0.7;
            margin-bottom: 1px;
        }

        .param-group .param-label .val {
            color: #e8c547;
            font-weight: 600;
            min-width: 32px;
            text-align: right;
        }

        .param-group input[type="range"] {
            width: 100%;
            height: 3px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            outline: none;
        }

        .param-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #e8c547;
            cursor: pointer;
            border: 2px solid #1a1a2e;
        }

        .param-group input[type="range"]::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #e8c547;
            cursor: pointer;
            border: 2px solid #1a1a2e;
        }

        .param-group input[type="color"] {
            width: 100%;
            height: 30px;
            border: none;
            border-radius: 6px;
            background: transparent;
            cursor: pointer;
            padding: 0;
        }

        .param-group input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 2px;
        }

        .param-group input[type="color"]::-webkit-color-swatch {
            border-radius: 6px;
            border: 2px solid rgba(255, 255, 255, 0.15);
        }

        .param-row {
            display: flex;
            gap: 10px;
        }

        .param-row .param-group {
            flex: 1;
        }

        /* 部件列表 */
        .parts-list {
            margin: 8px 0 4px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .parts-list .part-tag {
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
        }

        .parts-list .part-tag:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .parts-list .part-tag.active {
            border-color: #e8c547;
            background: rgba(232, 197, 71, 0.15);
            color: #e8c547;
        }

        .parts-list .part-tag .del-part {
            margin-left: 6px;
            color: #e74c3c;
            cursor: pointer;
            opacity: 0.6;
        }

        .parts-list .part-tag .del-part:hover {
            opacity: 1;
        }

        /* ★ 複製部件按鈕 */
        .parts-list .part-tag .clone-part {
            margin-left: 6px;
            color: #e8c547;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.15s;
        }

        .parts-list .part-tag .clone-part:hover {
            opacity: 1;
        }

        /* 添加部件 */
        .add-part-row {
            display: flex;
            gap: 6px;
            margin-top: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .add-part-row select {
            flex: 1;
            min-width: 80px;
            background: #0f0f1a;
            color: #f0e6d3;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 0.75rem;
            outline: none;
            cursor: pointer;
        }

        .add-part-row select:focus {
            border-color: #e8c547;
        }

        .add-part-row .btn {
            padding: 4px 12px;
            font-size: 0.7rem;
        }

        /* 響應式 */
        @media (max-width: 820px) {
            #panel {
                width: 300px;
                min-width: 200px;
            }

            #topBar h1 {
                font-size: 1rem;
            }

            .btn {
                padding: 6px 12px;
                font-size: 0.75rem;
            }

            .accordion-header .piece-icon {
                font-size: 1.1rem;
                width: 24px;
            }

            .accordion-header .piece-name {
                font-size: 0.8rem;
            }
        }

        @media (max-width: 640px) {
            #main {
                flex-direction: column;
            }

            #panel {
                width: 100%;
                max-width: 100%;
                border-left: none;
                border-top: 2px solid #e8c547;
                height: 50vh;
                min-height: 300px;
            }

            #sceneContainer {
                height: 50vh;
                min-height: 200px;
            }

            #sceneHint {
                bottom: 8px;
                font-size: 0.6rem;
                padding: 4px 12px;
                white-space: normal;
            }
        }

        @media (max-width: 480px) {
            #topBar {
                padding: 6px 12px;
            }

            #topBar h1 {
                font-size: 0.85rem;
            }

            .btn {
                padding: 4px 10px;
                font-size: 0.7rem;
            }

            #panelBody {
                padding: 4px 8px 12px;
            }

            .accordion-body {
                padding: 0 8px;
            }

            .accordion-item.active .accordion-body {
                padding: 0 8px 16px;
            }

            .param-group .param-label {
                font-size: 0.65rem;
            }

            .parts-list .part-tag {
                font-size: 0.6rem;
                padding: 1px 8px;
            }
        }

        /* 匯出 / 匯入 模態框共用樣式 */
        .modal-box {
            background: #1a1a2e;
            border: 2px solid #e8c547;
            border-radius: 16px;
            padding: 28px 32px;
            max-width: 720px;
            width: 92%;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        .modal-box h2 {
            color: #e8c547;
            margin-bottom: 12px;
            font-size: 1.2rem;
        }

        .modal-box textarea {
            flex: 1;
            min-height: 280px;
            background: #0f0f1a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #d4d4d4;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            padding: 14px;
            resize: vertical;
            outline: none;
            tab-size: 2;
            line-height: 1.5;
        }

        .modal-box textarea:focus {
            border-color: #e8c547;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 14px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .modal-actions .btn {
            padding: 10px 24px;
        }

        #exportModal,
        #importModal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 999;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
        }

        #exportModal.open,
        #importModal.open {
            display: flex;
        }

        .copy-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2ecc71;
            color: #1a1a2e;
            padding: 10px 28px;
            border-radius: 12px;
            font-weight: 700;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            box-shadow: 0 8px 30px rgba(46, 204, 113, 0.3);
        }

        .copy-toast.show {
            opacity: 1;
        }
    </style>
</head>

<body>

    <div id="topBar">
        <h1>
            ♟ 棋子編輯器 <small>部件級移動・添加形狀</small>
        </h1>
        <div class="top-actions">
            <button class="btn btn-secondary" onclick="resetAll()">↺ 重置</button>
            <button class="btn btn-warning" onclick="openImportModal()">📥 匯入</button>
            <button class="btn btn-success" onclick="exportCode()">📤 匯出</button>
        </div>
    </div>

    <div id="main">
        <div id="sceneContainer">
            <div id="sceneHint">🖱 左鍵旋轉 · 滾輪縮放 · 右鍵平移</div>
        </div>
        <div id="panel">
            <div id="panelHeader">
                <h2>⚙ 參數調整</h2>
                <span class="badge">即時預覽</span>
            </div>
            <div id="panelBody"></div>
        </div>
    </div>

    <!-- 匯出模態框 -->
    <div id="exportModal">
        <div class="modal-box">
            <h2>📤 匯出棋子模型代碼</h2>
            <p style="opacity:0.6;font-size:0.85rem;margin-bottom:12px;">
                複製下方代碼，替換原 <code style="background:#2a2a4a;padding:2px 8px;border-radius:4px;">PIECE_PARAMS</code>
            </p>
            <textarea id="exportCodeArea" spellcheck="false"></textarea>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeExport()">關閉</button>
                <button class="btn btn-success" onclick="copyExport()">📋 複製</button>
            </div>
        </div>
    </div>

    <!-- 匯入模態框 -->
    <div id="importModal">
        <div class="modal-box">
            <h2>📥 匯入棋子參數</h2>
            <p style="opacity:0.6;font-size:0.85rem;margin-bottom:12px;">
                貼上從編輯器匯出的 JSON 代碼（可包含 <code
                    style="background:#2a2a4a;padding:2px 8px;border-radius:4px;">const PIECE_PARAMS = </code> 前綴）
            </p>
            <textarea id="importCodeArea" spellcheck="false" placeholder="請貼上 JSON 代碼..."></textarea>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeImport()">取消</button>
                <button class="btn btn-success" onclick="doImport()">📥 導入</button>
            </div>
        </div>
    </div>

    <div class="copy-toast" id="copyToast">✅ 已複製</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js">
    </script>

                    }
                }
            },
            "king": {
                "bodyRadius": 0.235,
                "bodyHeight": 0.5,
                "crownRadius": 0.25,
                "crownHeight": 0.12,
                "crossWidth": 0.07,

                "crossDepth": 0.105,
                "color": "#f5f0e1",
                "roughness": 0.25,
                "metalness": 0.2,
                "position": { "x": 4.2, "y": 0.04, "z": 0 },
                "parts": {
                    "custom_1000": {
                        "type": "cone",
                        "geometryParams": { "radius": 0.15, "height": 0.3 },
                        "roughness": 0.5,
                        "metalness": 0.2,
                        "position": { "x": 0, "y": 0.57, "z": 0 },
                        "rotation": { "x": -3.14, "y": 0, "z": 0 },
                        "scale": { "x": 1.4, "y": 1, "z": 1.4 },
                        "name": "Cone"
                    },
                    "body": {
                        "position": { "x": 0, "y": 0.31, "z": 0 },
                        "rotation": { "x": 0, "y": 0, "z": 0 },
                        "scale": { "x": 0.54, "y": 1, "z": 0.56 }
                    },
                    "crown": {
                        "position": { "x": 0, "y": 0.51, "z": 0 },
                        "rotation": { "x": 0, "y": 0, "z": 0 },
                        "scale": { "x": 0.8, "y": 0.6, "z": 0.8 }
                    },
                    "crossH": {
                        "position": { "x": 0, "y": 0.85, "z": 0 },
                        "rotation": { "x": 0, "y": 0, "z": 0 },
                        "scale": { "x": 1, "y": 1, "z": 1 }
                    }
                }
            }
        };

        let currentParams = JSON.parse(JSON.stringify(DEFAULT_PARAMS));
        const PIECE_TYPES = ['pawn', 'rook', 'knight', 'bishop', 'queen', 'king'];
        const PIECE_NAMES = { pawn: '兵', rook: '車', knight: '馬', bishop: '象', queen: '后', king: '王' };
        const PIECE_ICONS = { pawn: '♟', rook: '♜', knight: '♞', bishop: '♝', queen: '♛', king: '♚' };

        // ============================================================
        //  2. Three.js 場景
        // ============================================================
        let scene, camera, renderer, controls;
        let pieceGroups = {};
        let selectedPart = null; // { type, partId }
        let partIdCounter = 1000;

        const container = document.getElementById('sceneContainer');

        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x12121f);

            const w = container.clientWidth || 600;
            const h = container.clientHeight || 400;
            camera = new THREE.PerspectiveCamera(40, w / h, 0.1, 60);
            camera.position.set(0, 5, 9);
            camera.lookAt(0, 0.3, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(w, h);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            container.prepend(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 0.4, 0);
            controls.enableDamping = true;
            controls.dampingFactor = 0.08;
            controls.minDistance = 3;
            controls.maxDistance = 18;
            controls.update();

            // 燈光
            const ambient = new THREE.AmbientLight(0x404060, 0.6);
            scene.add(ambient);
            const hemi = new THREE.HemisphereLight(0xffeedd, 0x443322, 1.0);
            scene.add(hemi);
            const key = new THREE.DirectionalLight(0xffffff, 2.2);
            key.position.set(4, 10, 6);
            key.castShadow = true;
            key.shadow.mapSize.width = 1024;
            key.shadow.mapSize.height = 1024;
            key.shadow.bias = -0.001;
            scene.add(key);
            const fill = new THREE.DirectionalLight(0x8899ff, 0.5);
            fill.position.set(-3, 5, -4);
            scene.add(fill);
            const rim = new THREE.DirectionalLight(0xffffff, 0.4);
            rim.position.set(-2, 1, 8);
            scene.add(rim);

            // 地面
            const gridHelper = new THREE.GridHelper(8, 8, 0xe8c547, 0x444466);
            gridHelper.position.y = -0.05;
            scene.add(gridHelper);
            const discGeo = new THREE.RingGeometry(3.8, 4.2, 48);
            const discMat = new THREE.MeshBasicMaterial({
                color: 0xe8c547, transparent: true, opacity: 0.08, side: THREE
                    .DoubleSide
            });
            const disc = new THREE.Mesh(discGeo, discMat);
            disc.rotation.x = -Math.PI / 2;
            disc.position.y = -0.04;
            scene.add(disc);

            createLabels();
            window.addEventListener('resize', onResize);
            animate();
        }

        function onResize() {
            const w = container.clientWidth || 600;
            const h = container.clientHeight || 400;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function createLabels() {
            const labels = [
                { text: '♟ 兵', x: -4.2 },
                { text: '♜ 車', x: -2.52 },
                { text: '♞ 馬', x: -0.84 },
                { text: '♝ 象', x: 0.84 },
                { text: '♛ 后', x: 2.52 },
                { text: '♚ 王', x: 4.2 }
            ];

            for (const label of labels) {
                // One canvas per label — otherwise all sprites share the same
                // texture and every label ends up showing the last-drawn text.
                const canvas = document.createElement('canvas');
                canvas.width = 256;
                canvas.height = 64;
                const ctx = canvas.getContext('2d');

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                // drop shadow
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 12;
                ctx.font = 'bold 28px "Segoe UI", "Microsoft JhengHei", sans-serif';
                ctx.fillStyle = '#e8c547';
                ctx.fillText(label.text, canvas.width / 2, canvas.height / 2 + 2);

                // main text
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#e8c547';
                ctx.fillText(label.text, canvas.width / 2, canvas.height / 2);

                const texture = new THREE.CanvasTexture(canvas);
                texture.needsUpdate = true;

                const mat = new THREE.SpriteMaterial({
                    map: texture,
                    transparent: true,
                    depthTest: false,
                    sizeAttenuation: true
                });
                const sprite = new THREE.Sprite(mat);
                sprite.scale.set(1.6, 0.4, 1);
                sprite.position.set(label.x, -0.2, 0);
                scene.add(sprite);
            }
        }

        // ============================================================
        //  3. 棋子構建 (帶部件命名)
        // ============================================================
        function buildPiece(type, params, customParts) {
            const group = new THREE.Group();
            group.userData.parts = {};

            const color = params.color || '#f5f0e1';
            const roughness = params.roughness ?? 0.25;
            const metalness = params.metalness ?? 0.20;

            const baseMat = new THREE.MeshStandardMaterial({ color, roughness, metalness });
            const accentMat = new THREE.MeshStandardMaterial({
                color, roughness: Math.min(1, roughness + 0.1),
                metalness: Math.max(0, metalness - 0.05)
            });

            const addPart = (geo, mat, x, y, z, rot, partKey, displayName) => {
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(x, y, z);
                if (rot) mesh.rotation.copy(rot);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                mesh.userData.partKey = partKey;
                mesh.userData.partName = displayName || partKey;
                // 應用儲存的變換
                if (params.parts && params.parts[partKey]) {
                    const trans = params.parts[partKey];
                    if (trans.position) mesh.position.set(trans.position.x || 0, trans.position.y || 0, trans.position.z || 0);
                    if (trans.rotation) mesh.rotation.set(trans.rotation.x || 0, trans.rotation.y || 0, trans.rotation.z || 0);
                    if (trans.scale) mesh.scale.set(trans.scale.x || 1, trans.scale.y || 1, trans.scale.z || 1);
                }
                group.add(mesh);
                group.userData.parts[partKey] = mesh;
                return mesh;
            };

            const baseRadius = (type === 'king' || type === 'queen') ? 0.35 : 0.30;
            addPart(new THREE.CylinderGeometry(baseRadius, baseRadius * 1.15, 0.12, 16), baseMat, 0, 0.06, 0, null, 'base', '基座');

            switch (type) {
                case 'pawn': {
                    const { baseRadius: br, baseHeight: bh, topRadius: tr, topHeight: th, sphereRadius: sr } = params;
                    addPart(new THREE.CylinderGeometry(br, br * 1.2, bh, 12), baseMat, 0, 0.06 + bh / 2, 0, null, 'body', '身體');
                    addPart(new THREE.CylinderGeometry(tr * 1.1, tr, th, 12), accentMat, 0, 0.06 + bh + th / 2, 0, null, 'top', '頂部');
                    addPart(new THREE.SphereGeometry(sr, 12, 12), baseMat, 0, 0.06 + bh + th + sr * 0.7, 0, null, 'sphere', '球頂');
                    break;
                }
                case 'rook': {
                    const { bodyRadius: br, bodyHeight: bh, crownRadius: cr, crownHeight: ch } = params;
                    addPart(new THREE.CylinderGeometry(br, br * 1.15, bh, 16), baseMat, 0, 0.06 + bh / 2, 0, null, 'body', '身體');
                    addPart(new THREE.CylinderGeometry(cr, cr * 1.05, ch, 16), accentMat, 0, 0.06 + bh + ch / 2, 0, null, 'crown', '冠部');
                    break;
                }
                case 'knight': {
                    const { bodyRadius: br, bodyHeight: bh, neckWidth: nw, neckHeight: nh, neckDepth: nd,
                        headWidth: hw, headHeight: hh, headDepth: hd } = params;
                    addPart(new THREE.CylinderGeometry(br, br * 1.15, bh, 16), baseMat, 0, 0.06 + bh / 2, 0, null, 'body', '身體');
                    addPart(
                        new THREE.BoxGeometry(nw, nh, nd),
                        baseMat,
                        0.05, 0.06 + bh + nh / 2, -0.02,
                        new THREE.Euler(-0.3, 0, 0),
                        'neck', '頸部'
                    );
                    addPart(
                        new THREE.BoxGeometry(hw, hh, hd),
                        accentMat,
                        0.12, 0.06 + bh + nh + hh / 2 - 0.02, 0.08,
                        new THREE.Euler(-0.15, 0, 0),
                        'head', '頭部'
                    );
                    break;
                }
                case 'bishop': {
                    const { bodyRadius: br, bodyHeight: bh, sphereRadius: sr } = params;
                    addPart(new THREE.ConeGeometry(br, bh, 16), baseMat, 0, 0.06 + bh / 2, 0, null, 'body', '身體');
                    addPart(new THREE.SphereGeometry(sr, 10, 10), accentMat, 0, 0.06 + bh + sr * 0.7, 0, null, 'sphere', '球頂');
                    break;
                }
                case 'queen': {
                    const { bodyRadius: br, bodyHeight: bh, crownRadius: cr, crownHeight: ch, spikeRadius: spr } = params;
                    addPart(new THREE.CylinderGeometry(br, br * 1.12, bh, 16), baseMat, 0, 0.06 + bh / 2, 0, null, 'body', '身體');
                    addPart(new THREE.CylinderGeometry(cr, cr * 1.15, ch, 16), accentMat, 0, 0.06 + bh + ch / 2, 0, null, 'crown', '冠部');
                    addPart(new THREE.SphereGeometry(spr, 8, 8), accentMat, 0, 0.06 + bh + ch + spr * 1.2, 0, null, 'spike', '尖刺');
                    break;
                }
                case 'king': {
                    const { bodyRadius: br, bodyHeight: bh, crownRadius: cr, crownHeight: ch,
                        crossWidth: cw, crossHeight: ch2, crossDepth: cd } = params;
                    addPart(new THREE.CylinderGeometry(br, br * 1.12, bh, 16), baseMat, 0, 0.06 + bh / 2, 0, null, 'body', '身體');
                    addPart(new THREE.CylinderGeometry(cr, cr * 1.05, ch, 16), accentMat, 0, 0.06 + bh + ch / 2, 0, null, 'crown', '冠部');
                    addPart(new THREE.BoxGeometry(cw, ch2, cd), accentMat, 0, 0.06 + bh + ch + ch2 / 2, 0, null, 'crossV', '十字豎');
                    addPart(new THREE.BoxGeometry(ch2 * 0.7, ch2 * 0.3, cd * 0.6), accentMat, 0, 0.06 + bh + ch + ch2 * 0.75, 0, null, 'crossH', '十字橫');
                    break;
                }
                default: break;
            }

            // 添加自定義部件 (從 params.parts 中读取，排除内建键)
            if (customParts) {
                for (const [id, partData] of Object.entries(customParts)) {
                    if (['base', 'body', 'neck', 'head', 'top', 'sphere', 'crown', 'spike', 'crossV', 'crossH'].includes(id)) continue;
                    const geo = createGeometry(partData.type, partData.geometryParams || {});
                    const mat = createCustomPartMaterial(partData, params);
                    const mesh = new THREE.Mesh(geo, mat);
                    const trans = partData;
                    mesh.position.set(trans.position?.x || 0, trans.position?.y || 0, trans.position?.z || 0);
                    mesh.rotation.set(trans.rotation?.x || 0, trans.rotation?.y || 0, trans.rotation?.z || 0);
                    mesh.scale.set(trans.scale?.x || 1, trans.scale?.y || 1, trans.scale?.z || 1);
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                    mesh.userData.partKey = id;
                    mesh.userData.partName = partData.name || '自定義';
                    mesh.userData.isCustom = true;
                    group.add(mesh);
                    group.userData.parts[id] = mesh;
                }
            }

            return group;
        }

        function createGeometry(type, params) {
            switch (type) {
                case 'box':
                    return new THREE.BoxGeometry(params.width || 0.2, params.height || 0.2, params.depth || 0.2);
                case 'sphere':
                    return new THREE.SphereGeometry(params.radius || 0.15, 16, 16);
                case 'cylinder':
                    return new THREE.CylinderGeometry(params.radiusTop || 0.15, params.radiusBottom || 0.15, params.height ||
                        0.3, 16);
                case 'cone':
                    return new THREE.ConeGeometry(params.radius || 0.15, params.height || 0.3, 16);
                case 'torus':
                    return new THREE.TorusGeometry(params.radius || 0.15, params.tube || 0.05, 12, 16);
                default:
                    return new THREE.BoxGeometry(0.2, 0.2, 0.2);
            }
        }

        function createCustomPartMaterial(partData, pieceParams) {
            // No explicit color → inherit the piece's base color
            const resolvedColor = partData.color || pieceParams.color || '#f5f0e1';
            return new THREE.MeshStandardMaterial({
                color: resolvedColor,
                roughness: partData.roughness ?? 0.5,
                metalness: partData.metalness ?? 0.2,
            });
        }

        // ============================================================
        //  4. 更新場景
        // ============================================================
        function rebuildAllPieces() {
            for (const key of PIECE_TYPES) {
                if (pieceGroups[key]) {
                    scene.remove(pieceGroups[key]);
                    pieceGroups[key] = null;
                }
            }
            for (const type of PIECE_TYPES) {
                const params = currentParams[type];
                const pos = params.position || { x: 0, y: 0, z: 0 };
                const customParts = params.parts || {};
                const group = buildPiece(type, params, customParts);
                group.position.set(pos.x, pos.y, pos.z);
                scene.add(group);
                pieceGroups[type] = group;
            }
            updatePartsListUI();
            if (selectedPart) {
                highlightPart(selectedPart.type, selectedPart.partId);
            }
        }

        // ============================================================
        //  5. 面板UI生成
        // ============================================================

                <div class="pos-row">
                  <div class="param-group"><div class="param-label"><span>X</span><span class="val" id="partX_val_${type}">0.00</span></div>
                    <input type="range" id="partX_${type}" min="-2" max="2" step="0.01" value="0" /></div>

                });

                const roughInput = document.getElementById(`roughness_${type}`);
                const roughVal = document.getElementById(`roughness_val_${type}`);
                roughInput.addEventListener('input', () => {
                    params.roughness = parseFloat(roughInput.value);
                    roughVal.textContent = params.roughness.toFixed(2);
                    rebuildAllPieces();
                });

                const metalInput = document.getElementById(`metalness_${type}`);
                const metalVal = document.getElementById(`metalness_val_${type}`);
                metalInput.addEventListener('input', () => {
                    params.metalness = parseFloat(metalInput.value);
                    metalVal.textContent = params.metalness.toFixed(2);
                    rebuildAllPieces();
                });

                const posXSlider = document.getElementById(`posX_${type}`);
                const posYSlider = document.getElementById(`posY_${type}`);
                const posZSlider = document.getElementById(`posZ_${type}`);
                const posXVal = document.getElementById(`posX_val_${type}`);
                const posYVal = document.getElementById(`posY_val_${type}`);
                const posZVal = document.getElementById(`posZ_val_${type}`);
                const updatePos = () => {
                    params.position = {
                        x: parseFloat(posXSlider.value),
                        y: parseFloat(posYSlider.value),
                        z: parseFloat(posZSlider.value)
                    };
                    posXVal.textContent = params.position.x.toFixed(2);
                    posYVal.textContent = params.position.y.toFixed(2);
                    posZVal.textContent = params.position.z.toFixed(2);
                    rebuildAllPieces();
                };
                posXSlider.addEventListener('input', updatePos);
                posYSlider.addEventListener('input', updatePos);
                posZSlider.addEventListener('input', updatePos);

                // ---- 部件控制滑塊 ----
                const partX = document.getElementById(`partX_${type}`);
                const partY = document.getElementById(`partY_${type}`);
                const partZ = document.getElementById(`partZ_${type}`);
                const partRX = document.getElementById(`partRX_${type}`);
                const partRY = document.getElementById(`partRY_${type}`);
                const partRZ = document.getElementById(`partRZ_${type}`);
                const partSX = document.getElementById(`partSX_${type}`);
                const partSY = document.getElementById(`partSY_${type}`);
                const partSZ = document.getElementById(`partSZ_${type}`);

                const partXVal = document.getElementById(`partX_val_${type}`);
                const partYVal = document.getElementById(`partY_val_${type}`);
                const partZVal = document.getElementById(`partZ_val_${type}`);
                const partRXVal = document.getElementById(`partRX_val_${type}`);
                const partRYVal = document.getElementById(`partRY_val_${type}`);
                const partRZVal = document.getElementById(`partRZ_val_${type}`);
                const partSXVal = document.getElementById(`partSX_val_${type}`);
                const partSYVal = document.getElementById(`partSY_val_${type}`);
                const partSZVal = document.getElementById(`partSZ_val_${type}`);

                const updatePart = () => {
                    if (!selectedPart || selectedPart.type !== type) return;
                    const mesh = getPartMesh(type, selectedPart.partId);
                    if (!mesh) return;
                    const p = {
                        x: parseFloat(partX.value),
                        y: parseFloat(partY.value),
                        z: parseFloat(partZ.value)
                    };
                    const r = {
                        x: parseFloat(partRX.value),
                        y: parseFloat(partRY.value),
                        z: parseFloat(partRZ.value)
                    };
                    const s = {
                        x: parseFloat(partSX.value),
                        y: parseFloat(partSY.value),
                        z: parseFloat(partSZ.value)
                    };
                    mesh.position.set(p.x, p.y, p.z);
                    mesh.rotation.set(r.x, r.y, r.z);
                    mesh.scale.set(s.x, s.y, s.z);

                    const partId = selectedPart.partId;
                    if (!params.parts[partId]) {
                        params.parts[partId] = { position: p, rotation: r, scale: s };
                    } else {
                        const partData = params.parts[partId];
                        partData.position = p;
                        partData.rotation = r;
                        partData.scale = s;
                    }

                    partXVal.textContent = p.x.toFixed(2);
                    partYVal.textContent = p.y.toFixed(2);
                    partZVal.textContent = p.z.toFixed(2);
                    partRXVal.textContent = r.x.toFixed(2);
                    partRYVal.textContent = r.y.toFixed(2);
                    partRZVal.textContent = r.z.toFixed(2);
                    partSXVal.textContent = s.x.toFixed(2);
                    partSYVal.textContent = s.y.toFixed(2);
                    partSZVal.textContent = s.z.toFixed(2);
                };

                [partX, partY, partZ, partRX, partRY, partRZ, partSX, partSY, partSZ].forEach(slider => {
                    slider.addEventListener('input', updatePart);
                });

                document.getElementById(`partControls_${type}`).style.display = 'none';
            }

            const first = document.querySelector('.accordion-item');
            if (first) first.classList.add('active');

            updatePartsListUI();
        }

        // ============================================================
        //  6. 部件列表與選擇
        // ============================================================
        function updatePartsListUI() {
            for (const type of PIECE_TYPES) {
                const list = document.getElementById(`partsList_${type}`);
                if (!list) continue;
                list.innerHTML = '';
                const group = pieceGroups[type];
                if (!group) continue;
                const parts = group.userData.parts || {};
                const partIds = Object.keys(parts);
                if (partIds.length === 0) {
                    list.innerHTML = '<span style="font-size:0.7rem;opacity:0.4;">無部件</span>';
                    continue;
                }
                for (const [id, mesh] of Object.entries(parts)) {
                    const tag = document.createElement('span');
                    tag.className = 'part-tag';
                    if (selectedPart && selectedPart.type === type && selectedPart.partId === id) {
                        tag.classList.add('active');
                    }
                    const name = mesh.userData.partName || id;
                    tag.textContent = name;
                    tag.title = id;
                    const isCustom = mesh.userData.isCustom || false;

                    // ★ 複製按鈕（所有部件都可以複製）
                    const cloneBtn = document.createElement('span');
                    cloneBtn.className = 'clone-part';
                    cloneBtn.textContent = '📋';
                    cloneBtn.title = '複製部件';
                    cloneBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        clonePart(type, id);
                    });
                    tag.appendChild(cloneBtn);

                    // 刪除按鈕（僅自定義部件）
                    if (isCustom) {
                        const del = document.createElement('span');
                        del.className = 'del-part';
                        del.textContent = '✕';
                        del.addEventListener('click', (e) => {
                            e.stopPropagation();
                            deletePart(type, id);
                        });
                        tag.appendChild(del);
                    }

                    tag.addEventListener('click', () => {
                        selectPart(type, id);
                    });
                    list.appendChild(tag);
                }
            }
            updatePartControls();
        }

        function selectPart(type, partId) {
            selectedPart = { type, partId };
            document.querySelectorAll('.parts-list').forEach(list => {
                list.querySelectorAll('.part-tag').forEach(tag => {
                    tag.classList.remove('active');
                });
            });
            const list = document.getElementById(`partsList_${type}`);
            if (list) {
                const tags = list.querySelectorAll('.part-tag');
                for (const tag of tags) {
                    if (tag.title === partId) {
                        tag.classList.add('active');
                        break;
                    }
                }
            }
            const controls = document.getElementById(`partControls_${type}`);
            if (controls) controls.style.display = 'block';
            const nameSpan = document.getElementById(`selectedPartName_${type}`);
            if (nameSpan) {
                const mesh = getPartMesh(type, partId);
                nameSpan.textContent = mesh ? mesh.userData.partName || partId : '未知';
            }
            const mesh = getPartMesh(type, partId);
            if (mesh) {
                const p = mesh.position;
                const r = mesh.rotation;
                const s = mesh.scale;
                document.getElementById(`partX_${type}`).value = p.x;
                document.getElementById(`partY_${type}`).value = p.y;
                document.getElementById(`partZ_${type}`).value = p.z;
                document.getElementById(`partRX_${type}`).value = r.x;
                document.getElementById(`partRY_${type}`).value = r.y;
                document.getElementById(`partRZ_${type}`).value = r.z;
                document.getElementById(`partSX_${type}`).value = s.x;
                document.getElementById(`partSY_${type}`).value = s.y;
                document.getElementById(`partSZ_${type}`).value = s.z;
                document.getElementById(`partX_val_${type}`).textContent = p.x.toFixed(2);
                document.getElementById(`partY_val_${type}`).textContent = p.y.toFixed(2);
                document.getElementById(`partZ_val_${type}`).textContent = p.z.toFixed(2);
                document.getElementById(`partRX_val_${type}`).textContent = r.x.toFixed(2);
                document.getElementById(`partRY_val_${type}`).textContent = r.y.toFixed(2);
                document.getElementById(`partRZ_val_${type}`).textContent = r.z.toFixed(2);
                document.getElementById(`partSX_val_${type}`).textContent = s.x.toFixed(2);
                document.getElementById(`partSY_val_${type}`).textContent = s.y.toFixed(2);
                document.getElementById(`partSZ_val_${type}`).textContent = s.z.toFixed(2);
            }
            highlightPart(type, partId);
        }

        function getPartMesh(type, partId) {
            const group = pieceGroups[type];
            if (!group) return null;
            return group.userData.parts[partId] || null;
        }

        function highlightPart(type, partId) {
            for (const t of PIECE_TYPES) {
                const g = pieceGroups[t];
                if (!g) continue;
                for (const [id, mesh] of Object.entries(g.userData.parts || {})) {
                    if (mesh.material && mesh.material.emissive) {
                        mesh.material.emissive.setHex(0x000000);
                    }
                }
            }
            const mesh = getPartMesh(type, partId);
            if (mesh && mesh.material && mesh.material.emissive) {
                mesh.material.emissive.setHex(0xe8c547);
                mesh.material.emissiveIntensity = 0.3;
            }
        }

        function updatePartControls() {
            for (const type of PIECE_TYPES) {
                const controls = document.getElementById(`partControls_${type}`);
                if (!controls) continue;
                if (selectedPart && selectedPart.type === type) {
                    controls.style.display = 'block';
                } else {
                    controls.style.display = 'none';
                }
            }
        }

        // ============================================================
        //  7. 添加/複製/刪除部件
        // ============================================================
        function addPartToPiece(type) {
            const select = document.getElementById(`addPartType_${type}`);
            const shapeType = select.value;
            const params = currentParams[type];
            if (!params.parts) params.parts = {};

            const id = 'custom_' + (partIdCounter++);
            let geoParams = {};
            switch (shapeType) {
                case 'box': geoParams = { width: 0.2, height: 0.2, depth: 0.2 }; break;
                case 'sphere': geoParams = { radius: 0.15 }; break;
                case 'cylinder': geoParams = { radiusTop: 0.15, radiusBottom: 0.15, height: 0.3 }; break;
                case 'cone': geoParams = { radius: 0.15, height: 0.3 }; break;
                case 'torus': geoParams = { radius: 0.15, tube: 0.05 }; break;
                default: geoParams = { width: 0.2, height: 0.2, depth: 0.2 };
            }

            const partData = {
                type: shapeType,
                geometryParams: geoParams,
                // ❌ no "color" field → will inherit the piece's base color
                roughness: 0.5,
                metalness: 0.2,
                position: { x: 0, y: 0.2, z: 0 },
                rotation: { x: 0, y: 0, z: 0 },
                scale: { x: 1, y: 1, z: 1 },
                name: shapeType.charAt(0).toUpperCase() + shapeType.slice(1),
            };
            params.parts[id] = partData;

            // ---- Attach mesh in-place; do NOT rebuild all pieces ----
            const group = pieceGroups[type];
            if (group) {
                const geo = createGeometry(partData.type, partData.geometryParams);
                const mat = createCustomPartMaterial(partData, params);
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(partData.position.x, partData.position.y, partData.position.z);
                mesh.rotation.set(partData.rotation.x, partData.rotation.y, partData.rotation.z);
                mesh.scale.set(partData.scale.x, partData.scale.y, partData.scale.z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                mesh.userData.partKey = id;
                mesh.userData.partName = partData.name;
                mesh.userData.isCustom = true;
                group.add(mesh);
                group.userData.parts[id] = mesh;
            }

            updatePartsListUI();
            selectPart(type, id);
            showToast('✅ 已添加 ' + partData.name);
        }

        // ------------------------------------------------------------
        //  ★ 從既有 mesh 反推 geometry 參數，用於複製內建部件時
        //    能正確序列化到 params.parts 中。
        // ------------------------------------------------------------
        function inferGeometryInfo(mesh) {
            const geo = mesh.geometry;
            if (!geo) return null;
            const p = geo.parameters || {};
            switch (geo.type) {
                case 'BoxGeometry':
                    return { type: 'box', geometryParams: { width: p.width, height: p.height, depth: p.depth } };
                case 'SphereGeometry':
                    return { type: 'sphere', geometryParams: { radius: p.radius } };
                case 'CylinderGeometry':
                    return {
                        type: 'cylinder',
                        geometryParams: { radiusTop: p.radiusTop, radiusBottom: p.radiusBottom, height: p.height }
                    };
                case 'ConeGeometry':
                    return { type: 'cone', geometryParams: { radius: p.radius, height: p.height } };
                case 'TorusGeometry':
                    return { type: 'torus', geometryParams: { radius: p.radius, tube: p.tube } };
                default:
                    return null;
            }
        }

        // ------------------------------------------------------------
        //  ★ 複製部件（複製品與原部件完全重合）
        //  - 幾何體：共用來源 mesh 的 geometry（不重建、不浪費記憶體）
        //  - 材質：複製一份，並清空高亮狀態，避免繼承來源的 emissive
        //  - 變換：position / rotation / scale 完整複製（不偏移）
        // ------------------------------------------------------------
        function clonePart(type, partId) {
            const params = currentParams[type];
            const group = pieceGroups[type];
            if (!group) {
                showToast('⚠️ 找不到棋子');
                return;
            }

            const sourceMesh = getPartMesh(type, partId);
            if (!sourceMesh) {
                showToast('⚠️ 找不到該部件');
                return;
            }

            const newId = 'custom_' + (partIdCounter++);

            // --- 1. 建立新 mesh ---
            //  材質：複製一份，並清除高亮狀態
            const newMaterial = sourceMesh.material
                ? sourceMesh.material.clone()
                : new THREE.MeshStandardMaterial({ color: params.color || '#f5f0e1' });
            if (newMaterial.emissive) {
                newMaterial.emissive.setHex(0x000000);
                newMaterial.emissiveIntensity = 1;
            }

            const newMesh = new THREE.Mesh(sourceMesh.geometry, newMaterial);
            // ★ 完整複製變換（與原部件完全重合，不偏移）
            newMesh.position.copy(sourceMesh.position);
            newMesh.rotation.copy(sourceMesh.rotation);
            newMesh.scale.copy(sourceMesh.scale);
            newMesh.castShadow = true;
            newMesh.receiveShadow = true;
            newMesh.userData.partKey = newId;
            newMesh.userData.partName = (sourceMesh.userData.partName || '部件') + ' Copy';
            newMesh.userData.isCustom = true;

            group.add(newMesh);
            group.userData.parts[newId] = newMesh;

            // --- 2. 寫入 params.parts（匯出時才會保留） ---
            if (!params.parts) params.parts = {};

            const sourceData = params.parts[partId];
            let newData;

            if (sourceData && sourceData.type) {
                // 來源是自定義部件 → 深拷貝
                newData = JSON.parse(JSON.stringify(sourceData));
            } else {
                // 來源是內建部件 → 從 mesh 反推 geometry 參數
                const geoInfo = inferGeometryInfo(sourceMesh);
                if (!geoInfo) {
                    showToast('⚠️ 此部件無法複製（幾何體無法辨識）');
                    group.remove(newMesh);
                    delete group.userData.parts[newId];
                    return;
                }
                newData = {
                    type: geoInfo.type,
                    geometryParams: geoInfo.geometryParams,
                    roughness: (sourceMesh.material && sourceMesh.material.roughness) ?? 0.5,
                    metalness: (sourceMesh.material && sourceMesh.material.metalness) ?? 0.2,
                };
            }

            // ★ 使用「來源 mesh 的實際數值」，確保複製品與原部件完全重合
            newData.position = { x: sourceMesh.position.x, y: sourceMesh.position.y, z: sourceMesh.position.z };
            newData.rotation = { x: sourceMesh.rotation.x, y: sourceMesh.rotation.y, z: sourceMesh.rotation.z };
            newData.scale = { x: sourceMesh.scale.x, y: sourceMesh.scale.y, z: sourceMesh.scale.z };
            newData.name = newMesh.userData.partName;

            params.parts[newId] = newData;

            // --- 3. UI 更新 ---
            updatePartsListUI();
            selectPart(type, newId);
            const total = Object.keys(group.userData.parts).length;
            showToast('📋 已複製 ' + (sourceMesh.userData.partName || '部件') + `（共 ${total} 個部件）`);
        }
        function deletePart(type, partId) {
            if (!confirm('確定刪除該部件嗎？')) return;
            const mesh = getPartMesh(type, partId);
            if (!mesh || !mesh.userData.isCustom) {
                showToast('只能刪除自定義部件');
                return;
            }
            const params = currentParams[type];
            if (params.parts && params.parts[partId]) {
                delete params.parts[partId];
            }
            const group = pieceGroups[type];
            if (group && mesh) {
                group.remove(mesh);
                delete group.userData.parts[partId];
            }
            if (selectedPart && selectedPart.type === type && selectedPart.partId === partId) {
                selectedPart = null;
            }
            updatePartsListUI();
            updatePartControls();
            showToast('🗑 已刪除部件');
        }

        // ============================================================
        //  8. 重置功能
        // ============================================================
        function resetPiece(type) {
            currentParams[type] = JSON.parse(JSON.stringify(DEFAULT_PARAMS[type]));
            if (window._partTransforms) delete window._partTransforms;
            const wasActive = document.querySelector(`.accordion-item[data-type="${type}"]`)?.classList.contains('active');
            buildPanel();
            if (wasActive) {
                const item = document.querySelector(`.accordion-item[data-type="${type}"]`);
                if (item) item.classList.add('active');
            }
            rebuildAllPieces();
            selectedPart = null;
            updatePartsListUI();
            updatePartControls();
        }

        function resetAll() {
            if (!confirm('確定重置所有棋子？')) return;
            currentParams = JSON.parse(JSON.stringify(DEFAULT_PARAMS));
            selectedPart = null;
            buildPanel();
            rebuildAllPieces();
            const first = document.querySelector('.accordion-item');
            if (first) first.classList.add('active');
            updatePartsListUI();
            updatePartControls();
            showToast('↺ 已重置');
        }

        // ============================================================
        //  9. 全局工具
        // ============================================================
        function resetAllPositions() {
            for (const type of PIECE_TYPES) {
                const def = DEFAULT_PARAMS[type];
                currentParams[type].position = { ...def.position };
            }
            rebuildAllPieces();
            refreshPanelPositions();
            showToast('↺ 位置已重置');
        }

        function arrangeInRow() {
            const count = PIECE_TYPES.length;
            const spacing = 1.68;
            const startX = -(count - 1) * spacing / 2;
            for (let i = 0; i < count; i++) {
                const type = PIECE_TYPES[i];
                const yOffset = { pawn: 0, rook: 0.02, knight: 0.02, bishop: 0.02, queen: 0.03, king: 0.04 };
                currentParams[type].position = { x: startX + i * spacing, y: yOffset[type] || 0, z: 0 };
            }
            rebuildAllPieces();
            refreshPanelPositions();
            showToast('➡ 已排列');
        }

        function randomizePositions() {
            for (const type of PIECE_TYPES) {
                const yOffset = { pawn: 0, rook: 0.02, knight: 0.02, bishop: 0.02, queen: 0.03, king: 0.04 };
                currentParams[type].position = {
                    x: (Math.random() - 0.5) * 8,
                    y: (yOffset[type] || 0) + (Math.random() - 0.5) * 0.6,
                    z: (Math.random() - 0.5) * 6
                };
            }
            rebuildAllPieces();
            refreshPanelPositions();
            showToast('🎲 隨機位置');
        }

        function refreshPanelPositions() {
            for (const type of PIECE_TYPES) {
                const pos = currentParams[type].position;
                const xSlider = document.getElementById(`posX_${type}`);
                const ySlider = document.getElementById(`posY_${type}`);
                const zSlider = document.getElementById(`posZ_${type}`);
                const xVal = document.getElementById(`posX_val_${type}`);
                const yVal = document.getElementById(`posY_val_${type}`);
                const zVal = document.getElementById(`posZ_val_${type}`);
                if (xSlider) {
                    xSlider.value = pos.x;
                    xVal.textContent = pos.x.toFixed(2);
                }
                if (ySlider) {
                    ySlider.value = pos.y;
                    yVal.textContent = pos.y.toFixed(2);
                }
                if (zSlider) {
                    zSlider.value = pos.z;
                    zVal.textContent = pos.z.toFixed(2);
                }
            }
        }

        // ============================================================
        //  10. 匯出 & 匯入
        // ============================================================
        function exportCode() {
            const modal = document.getElementById('exportModal');
            const area = document.getElementById('exportCodeArea');
            let code = `const PIECE_PARAMS = ${JSON.stringify(currentParams, null, 2)};`;
            area.value = code;
            modal.classList.add('open');
        }

        function closeExport() {
            document.getElementById('exportModal').classList.remove('open');
        }

        function copyExport() {
            const area = document.getElementById('exportCodeArea');
            navigator.clipboard.writeText(area.value).then(() => {
                showToast('✅ 已複製');
            }).catch(() => {
                area.select();
                document.execCommand('copy');
                showToast('✅ 已複製');
            });
        }

        // ---- 匯入：打開模態框 ----
        function openImportModal() {
            document.getElementById('importModal').classList.add('open');
            document.getElementById('importCodeArea').value = '';
        }

        function closeImport() {
            document.getElementById('importModal').classList.remove('open');
        }

        // ---- 執行匯入 ----
        function doImport() {
            const area = document.getElementById('importCodeArea');
            let raw = area.value.trim();
            if (!raw) {
                showToast('⚠️ 請貼上 JSON 代碼');
                return;
            }

            // 嘗試提取 JSON：如果包含 'PIECE_PARAMS ='，則取其後的部分
            let jsonStr = raw;
            const assignMatch = raw.match(/PIECE_PARAMS\s*=\s*({[\s\S]*});?/);
            if (assignMatch) {
                jsonStr = assignMatch[1];
            }

            try {
                const imported = JSON.parse(jsonStr);
                // 基本校验
                const required = ['pawn', 'rook', 'knight', 'bishop', 'queen', 'king'];
                const allPresent = required.every(t => imported[t]);
                if (!allPresent) {
                    showToast('❌ 缺少必要的棋子類型 (pawn, rook, knight, bishop, queen, king)');
                    return;
                }
                // 覆盖当前参数
                currentParams = imported;
                selectedPart = null;

                // ★ 掃描匯入資料中所有 custom_XXXX，把 partIdCounter 推到最大 +1，避免撞名
                partIdCounter = 1000;
                for (const t of PIECE_TYPES) {
                    const parts = imported[t] && imported[t].parts;
                    if (!parts) continue;
                    for (const id of Object.keys(parts)) {
                        const m = /^custom_(\d+)$/.exec(id);
                        if (m) {
                            const n = parseInt(m[1], 10);
                            if (n >= partIdCounter) partIdCounter = n + 1;
                        }
                    }
                }

                buildPanel();
                rebuildAllPieces();
                const first = document.querySelector('.accordion-item');
                if (first) first.classList.add('active');
                closeImport();
                showToast('✅ 匯入成功！');
            } catch (e) {
                showToast('❌ JSON 解析錯誤: ' + e.message);
            }
        }

        // ============================================================
        //  11. Toast
        // ============================================================
        function showToast(msg) {
            const toast = document.getElementById('copyToast');
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // ============================================================
        //  12. 初始化
        // ============================================================
        function init() {
            initScene();
            buildPanel();
            rebuildAllPieces();
            const first = document.querySelector('.accordion-item');
            if (first) first.classList.add('active');
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

        // 暴露全局函數
        window.resetAll = resetAll;
        window.exportCode = exportCode;
        window.closeExport = closeExport;
        window.copyExport = copyExport;
        window.openImportModal = openImportModal;
        window.closeImport = closeImport;
        window.doImport = doImport;
        window.resetPiece = resetPiece;
        window.resetAllPositions = resetAllPositions;
        window.arrangeInRow = arrangeInRow;
        window.randomizePositions = randomizePositions;
        window.addPartToPiece = addPartToPiece;
        window.clonePart = clonePart;
        window.deletePart = deletePart;
        window.selectPart = selectPart;
        window.showToast = showToast;
    </script>
</body>

</html>
