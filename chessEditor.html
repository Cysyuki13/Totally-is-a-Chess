        // ============================================================
        //  3. 棋子構建 (帶部件命名)
        // ============================================================
        function buildPiece(type, params, customParts) {
            const group = new THREE.Group();
            group.userData.parts = {};

            const color = params.color || '#f5f0e1';
            const roughness = params.roughness ?? 0.25;
            const metalness = params.metalness ?? 0.20;

            const baseMat = new THREE.MeshStandardMaterial({ color, roughness, metalness });
            const accentMat = new THREE.MeshStandardMaterial({
                color, roughness: Math.min(1, roughness + 0.1),
                metalness: Math.max(0, metalness - 0.05)
            });

            const addPart = (geo, mat, x, y, z, rot, partKey, displayName) => {
                const stored = (params.parts && params.parts[partKey]) || null;

                // ★ 已被刪除的內建部件：不再生成
                if (stored && stored.deleted) return null;

                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(x, y, z);
                if (rot) mesh.rotation.copy(rot);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                mesh.userData.partKey = partKey;
                // ★ 自訂名稱優先於預設名稱
                mesh.userData.partName = (stored && stored.name) || displayName || partKey;
                mesh.userData.isBuiltin = true;

                if (stored) {
                    if (stored.position) mesh.position.set(stored.position.x || 0, stored.position.y || 0, stored.position.z || 0);
                    if (stored.rotation) mesh.rotation.set(stored.rotation.x || 0, stored.rotation.y || 0, stored.rotation.z || 0);
                    if (stored.scale) mesh.scale.set(stored.scale.x || 1, stored.scale.y || 1, stored.scale.z || 1);
                }
                group.add(mesh);
                group.userData.parts[partKey] = mesh;
                return mesh;
            };

            const baseRadius = (type === 'king' || type === 'queen') ? 0.35 : 0.30;
            addPart(new THREE.CylinderGeometry(baseRadius, baseRadius * 1.15, 0.12, 16), baseMat, 0, 0.06, 0, null, 'base', '基座');

            switch (type) {
                case 'pawn': {
                    const { baseRadius: br, baseHeight: bh, topRadius: tr, topHeight: th, sphereRadius: sr } = params;
                    addPart(new THREE.CylinderGeometry(br, br * 1.2, bh, 12), baseMat, 0, 0.06 + bh / 2, 0, null, 'body', '身體');
                    addPart(new THREE.CylinderGeometry(tr * 1.1, tr, th, 12), accentMat, 0, 0.06 + bh + th / 2, 0, null, 'top', '頂部');
                    addPart(new THREE.SphereGeometry(sr, 12, 12), baseMat, 0, 0.06 + bh + th + sr * 0.7, 0, null, 'sphere', '球頂');
                    break;
                }
                case 'rook': {
                    const { bodyRadius: br, bodyHeight: bh, crownRadius: cr, crownHeight: ch } = params;
                    addPart(new THREE.CylinderGeometry(br, br * 1.15, bh, 16), baseMat, 0, 0.06 + bh / 2, 0, null, 'body', '身體');
                    addPart(new THREE.CylinderGeometry(cr, cr * 1.05, ch, 16), accentMat, 0, 0.06 + bh + ch / 2, 0, null, 'crown', '冠部');
                    break;
                }
                case 'knight': {
                    const { bodyRadius: br, bodyHeight: bh, neckWidth: nw, neckHeight: nh, neckDepth: nd,
                        headWidth: hw, headHeight: hh, headDepth: hd } = params;
                    addPart(new THREE.CylinderGeometry(br, br * 1.15, bh, 16), baseMat, 0, 0.06 + bh / 2, 0, null, 'body', '身體');
                    addPart(
                        new THREE.BoxGeometry(nw, nh, nd),
                        baseMat,
                        0.05, 0.06 + bh + nh / 2, -0.02,
                        new THREE.Euler(-0.3, 0, 0),
                        'neck', '頸部'
                    );
                    addPart(
                        new THREE.BoxGeometry(hw, hh, hd),
                        accentMat,
                        0.12, 0.06 + bh + nh + hh / 2 - 0.02, 0.08,
                        new THREE.Euler(-0.15, 0, 0),
                        'head', '頭部'
                    );
                    break;
                }
                case 'bishop': {
                    const { bodyRadius: br, bodyHeight: bh, sphereRadius: sr } = params;
                    addPart(new THREE.ConeGeometry(br, bh, 16), baseMat, 0, 0.06 + bh / 2, 0, null, 'body', '身體');
                    addPart(new THREE.SphereGeometry(sr, 10, 10), accentMat, 0, 0.06 + bh + sr * 0.7, 0, null, 'sphere', '球頂');
                    break;
                }
                case 'queen': {
                    const { bodyRadius: br, bodyHeight: bh, crownRadius: cr, crownHeight: ch, spikeRadius: spr } = params;
                    addPart(new THREE.CylinderGeometry(br, br * 1.12, bh, 16), baseMat, 0, 0.06 + bh / 2, 0, null, 'body', '身體');
                    addPart(new THREE.CylinderGeometry(cr, cr * 1.15, ch, 16), accentMat, 0, 0.06 + bh + ch / 2, 0, null, 'crown', '冠部');
                    addPart(new THREE.SphereGeometry(spr, 8, 8), accentMat, 0, 0.06 + bh + ch + spr * 1.2, 0, null, 'spike', '尖刺');
                    break;
                }
                case 'king': {
                    const { bodyRadius: br, bodyHeight: bh, crownRadius: cr, crownHeight: ch,
                        crossWidth: cw, crossHeight: ch2, crossDepth: cd } = params;
                    addPart(new THREE.CylinderGeometry(br, br * 1.12, bh, 16), baseMat, 0, 0.06 + bh / 2, 0, null, 'body', '身體');
                    addPart(new THREE.CylinderGeometry(cr, cr * 1.05, ch, 16), accentMat, 0, 0.06 + bh + ch / 2, 0, null, 'crown', '冠部');
                    addPart(new THREE.BoxGeometry(cw, ch2, cd), accentMat, 0, 0.06 + bh + ch + ch2 / 2, 0, null, 'crossV', '十字豎');
                    addPart(new THREE.BoxGeometry(ch2 * 0.7, ch2 * 0.3, cd * 0.6), accentMat, 0, 0.06 + bh + ch + ch2 * 0.75, 0, null, 'crossH', '十字橫');
                    break;
                }
                default: break;
            }

            if (customParts) {
                for (const [id, partData] of Object.entries(customParts)) {
                    if (BUILTIN_PART_IDS.includes(id)) continue;
                    if (partData.deleted) continue;   // ★ 跳過已刪除
                    const geo = createGeometry(partData.type, partData.geometryParams || {});
                    const mat = createCustomPartMaterial(partData, params);
                    const mesh = new THREE.Mesh(geo, mat);
                    const trans = partData;
                    mesh.position.set(trans.position?.x || 0, trans.position?.y || 0, trans.position?.z || 0);
                    mesh.rotation.set(trans.rotation?.x || 0, trans.rotation?.y || 0, trans.rotation?.z || 0);
                    mesh.scale.set(trans.scale?.x || 1, trans.scale?.y || 1, trans.scale?.z || 1);
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                    mesh.userData.partKey = id;
                    mesh.userData.partName = partData.name || '自定義';
                    mesh.userData.isCustom = true;
                    group.add(mesh);
                    group.userData.parts[id] = mesh;
                }
            }

            return group;
        }

        function createGeometry(type, params) {
            switch (type) {
                case 'box':
                    return new THREE.BoxGeometry(params.width || 0.2, params.height || 0.2, params.depth || 0.2);
                case 'sphere':
                    return new THREE.SphereGeometry(params.radius || 0.15, 16, 16);
                case 'cylinder':
                    return new THREE.CylinderGeometry(params.radiusTop || 0.15, params.radiusBottom || 0.15, params.height ||
                        0.3, 16);
                case 'cone':
                    return new THREE.ConeGeometry(params.radius || 0.15, params.height || 0.3, 16);
                case 'torus':
                    return new THREE.TorusGeometry(params.radius || 0.15, params.tube || 0.05, 12, 16);
                default:
                    return new THREE.BoxGeometry(0.2, 0.2, 0.2);
            }
        }

        function createCustomPartMaterial(partData, pieceParams) {
            const resolvedColor = partData.color || pieceParams.color || '#f5f0e1';
            return new THREE.MeshStandardMaterial({
                color: resolvedColor,
                roughness: partData.roughness ?? 0.5,
                metalness: partData.metalness ?? 0.2,
            });
        }

        // ============================================================
        //  4. 更新場景
        // ============================================================
        function rebuildAllPieces() {
            if (transformControls) transformControls.detach();

            for (const key of PIECE_TYPES) {
                if (pieceGroups[key]) {
                    scene.remove(pieceGroups[key]);
                    pieceGroups[key] = null;
                }
            }
            for (const type of PIECE_TYPES) {
                const params = currentParams[type];
                const pos = params.position || { x: 0, y: 0, z: 0 };
                const customParts = params.parts || {};
                const group = buildPiece(type, params, customParts);
                group.position.set(pos.x, pos.y, pos.z);
                scene.add(group);
                pieceGroups[type] = group;
            }
            updatePartsListUI();
            if (selectedPart) {
                highlightPart(selectedPart.type, selectedPart.partId);
                attachGizmo();
            }
        }

        // ============================================================
        //  5. UI 輔助工具
        // ============================================================
        function decimalsFor(step) {
            return step < 0.01 ? 3 : 2;
        }

        function rangeRow(label, id, value, min, max, step) {
            const v = Number(value);
            const dec = decimalsFor(step);
            const shown = isNaN(v) ? (0).toFixed(dec) : v.toFixed(dec);
            return `
              <div class="param-group">
                <div class="param-label">
                  <span>${label}</span>
                  <input type="number" class="num-input" id="${id}_num"
                         min="${min}" max="${max}" step="${step}" value="${shown}">
                </div>
                <input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${isNaN(v) ? 0 : v}">
              </div>`;
        }

        // 綁定一組滑桿 + 數字框（每次變更自動記錄歷史）
        function bindRange(id, onChange, opts = {}) {
            const range = document.getElementById(id);
            const num = document.getElementById(id + '_num');
            if (!range) return;
            const step = parseFloat(range.step) || 0.01;
            const dec = decimalsFor(step);

            range.addEventListener('input', () => {
                const v = parseFloat(range.value);
                if (num) num.value = v.toFixed(dec);
                onChange(v);
                if (!opts.noHistory) pushHistory();
            });

            if (!num) return;

            const commit = () => {
                let v = parseFloat(num.value);
                const min = parseFloat(range.min);
                const max = parseFloat(range.max);
                if (isNaN(v)) {
                    num.value = parseFloat(range.value).toFixed(dec);
                    return;
                }
                v = Math.min(max, Math.max(min, v));
                range.value = v;
                num.value = v.toFixed(dec);
                onChange(v);
                if (!opts.noHistory) pushHistory();
            };

            num.addEventListener('change', commit);
            num.addEventListener('blur', commit);
            num.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    commit();
                    num.blur();
                }
            });
        }

        function getRangeVal(id, fallback = 0) {
            const el = document.getElementById(id);
            if (!el) return fallback;
            const v = parseFloat(el.value);
            return isNaN(v) ? fallback : v;
        }

        function writePartTransform(type, partId, mesh) {
            const params = currentParams[type];
            if (!params.parts) params.parts = {};
            const pd = params.parts[partId] || (params.parts[partId] = {});
            const r4 = (v) => Math.round(v * 10000) / 10000;
            pd.position = { x: r4(mesh.position.x), y: r4(mesh.position.y), z: r4(mesh.position.z) };
            pd.rotation = { x: r4(mesh.rotation.x), y: r4(mesh.rotation.y), z: r4(mesh.rotation.z) };
            pd.scale = { x: r4(mesh.scale.x), y: r4(mesh.scale.y), z: r4(mesh.scale.z) };
        }

        function syncPartInputs(type) {
            if (!selectedPart || selectedPart.type !== type) return;
            const mesh = getPartMesh(type, selectedPart.partId);
            if (!mesh) return;

            const setVal = (id, v) => {
                const range = document.getElementById(id);
                const num = document.getElementById(id + '_num');
                if (!range) return;
                const dec = decimalsFor(parseFloat(range.step) || 0.01);
                range.value = v;
                if (num) num.value = Number(v).toFixed(dec);
            };

            setVal(`partX_${type}`, mesh.position.x);
            setVal(`partY_${type}`, mesh.position.y);
            setVal(`partZ_${type}`, mesh.position.z);
            setVal(`partRX_${type}`, mesh.rotation.x);
            setVal(`partRY_${type}`, mesh.rotation.y);
            setVal(`partRZ_${type}`, mesh.rotation.z);
            setVal(`partSX_${type}`, mesh.scale.x);
            setVal(`partSY_${type}`, mesh.scale.y);
            setVal(`partSZ_${type}`, mesh.scale.z);
        }

        // ============================================================
        //  6. 面板UI生成
        // ============================================================
        const panelBody = document.getElementById('panelBody');

        function buildPanel() {
            panelBody.innerHTML = '';

            const toolsDiv = document.createElement('div');
            toolsDiv.id = 'globalTools';
            toolsDiv.innerHTML = `
            <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">
              <button class="btn btn-secondary btn-sm" onclick="resetAllPositions()">↺ 重置位置</button>
              <button class="btn btn-warning btn-sm" onclick="arrangeInRow()">➡ 排列</button>
              <button class="btn btn-secondary btn-sm" onclick="randomizePositions()">🎲 隨機</button>
            </div>
          `;
            panelBody.appendChild(toolsDiv);

            for (const type of PIECE_TYPES) {
                const params = currentParams[type];
                const icon = PIECE_ICONS[type];
                const name = PIECE_NAMES[type];
                const pos = params.position || { x: 0, y: 0, z: 0 };

                const item = document.createElement('div');
                item.className = 'accordion-item';
                item.dataset.type = type;

                const header = document.createElement('div');
                header.className = 'accordion-header';
                header.innerHTML = `
              <span class="piece-icon">${icon}</span>
              <span class="piece-name">${name}</span>
              <span class="piece-color-dot" style="background:${params.color};"></span>
              <span class="arrow">▾</span>
            `;
                header.addEventListener('click', () => {
                    const active = item.classList.contains('active');
                    document.querySelectorAll('.accordion-item').forEach(el => el.classList.remove('active'));
                    if (!active) item.classList.add('active');
                    updatePartsListUI();
                });
                item.appendChild(header);

                const body = document.createElement('div');
                body.className = 'accordion-body';

                // 顏色 / 材質
                const colorRow = document.createElement('div');
                colorRow.className = 'param-row';
                colorRow.innerHTML = `
              <div class="param-group"><div class="param-label"><span>顏色</span></div>
                <input type="color" id="color_${type}" value="${params.color}" /></div>
              ${rangeRow('粗糙度', `roughness_${type}`, params.roughness, 0, 1, 0.01)}
              ${rangeRow('金屬感', `metalness_${type}`, params.metalness, 0, 1, 0.01)}
            `;
                body.appendChild(colorRow);

                // 整體位置
                const posDiv = document.createElement('div');
                posDiv.className = 'pos-group';
                posDiv.innerHTML = `
              <div class="pos-title">📍 整體位置</div>
              <div class="pos-row">
                ${rangeRow('X', `posX_${type}`, pos.x, -6, 6, 0.02)}
                ${rangeRow('Y', `posY_${type}`, pos.y, -1, 4, 0.02)}
                ${rangeRow('Z', `posZ_${type}`, pos.z, -4, 4, 0.02)}
              </div>
            `;
                body.appendChild(posDiv);

                // 部件編輯區
                const partsDiv = document.createElement('div');
                partsDiv.className = 'pos-group';
                partsDiv.id = `parts_${type}`;
                partsDiv.innerHTML = `
              <div class="pos-title">🧩 部件編輯</div>
              <div class="parts-list" id="partsList_${type}"></div>
              <div class="add-part-row">
                <select id="addPartType_${type}">
                  <option value="box">立方體</option>
                  <option value="sphere">球體</option>
                  <option value="cylinder">圓柱</option>
                  <option value="cone">圓錐</option>
                  <option value="torus">圓環</option>
                </select>
                <button class="btn btn-success btn-sm" onclick="addPartToPiece('${type}')">➕ 添加</button>
              </div>
              <div id="partControls_${type}" style="margin-top:8px;display:none;">
                <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px;">
                  <span style="font-size:0.7rem;opacity:0.6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
                    選中: <span id="selectedPartName_${type}">無</span>
                  </span>
                  <span style="font-size:0.62rem;opacity:0.45;white-space:nowrap;">拖曳箭頭調整</span>
                </div>
                <div class="gizmo-modes">
                  <button class="gizmo-btn active" data-mode="translate" onclick="setGizmoMode('translate')" title="移動 (G)">✥ 移動</button>
                  <button class="gizmo-btn" data-mode="rotate" onclick="setGizmoMode('rotate')" title="旋轉 (R)">⟳ 旋轉</button>
                  <button class="gizmo-btn" data-mode="scale" onclick="setGizmoMode('scale')" title="縮放 (S)">⤢ 縮放</button>
                  <button class="gizmo-btn gizmo-space-btn" onclick="toggleGizmoSpace()" title="切換世界/局部座標">🌐 世界</button>
                </div>
                <div class="pos-row">
                  ${rangeRow('X', `partX_${type}`, 0, -2, 2, 0.01)}
                  ${rangeRow('Y', `partY_${type}`, 0, -2, 2, 0.01)}
                  ${rangeRow('Z', `partZ_${type}`, 0, -2, 2, 0.01)}
                </div>
                <div class="pos-row">
                  ${rangeRow('RX', `partRX_${type}`, 0, -3.15, 3.15, 0.01)}
                  ${rangeRow('RY', `partRY_${type}`, 0, -3.15, 3.15, 0.01)}
                  ${rangeRow('RZ', `partRZ_${type}`, 0, -3.15, 3.15, 0.01)}
                </div>
                <div class="pos-row">
                  ${rangeRow('SX', `partSX_${type}`, 1, 0.05, 4, 0.01)}
                  ${rangeRow('SY', `partSY_${type}`, 1, 0.05, 4, 0.01)}
                  ${rangeRow('SZ', `partSZ_${type}`, 1, 0.05, 4, 0.01)}
                </div>
              </div>
            `;
                body.appendChild(partsDiv);

                // 重置按鈕
                const resetBtn = document.createElement('button');
                resetBtn.className = 'btn btn-secondary btn-sm';
                resetBtn.style.cssText = 'margin-top:8px;width:100%;justify-content:center;';
                resetBtn.textContent = '↺ 重置此棋子 (含部件)';
                resetBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    resetPiece(type);
                });
                body.appendChild(resetBtn);

                item.appendChild(body);
                panelBody.appendChild(item);

                // ---- 綁定事件 ----
                document.getElementById(`color_${type}`).addEventListener('input', function () {
                    params.color = this.value;
                    const dot = item.querySelector('.piece-color-dot');
                    if (dot) dot.style.background = this.value;
                    rebuildAllPieces();
                    pushHistory();
                });

                bindRange(`roughness_${type}`, (v) => {
                    params.roughness = v;
                    rebuildAllPieces();
                });

                bindRange(`metalness_${type}`, (v) => {
                    params.metalness = v;
                    rebuildAllPieces();
                });

                // 整體位置（只更新 group，不重建，避免打斷 gizmo）
                const updatePiecePos = () => {
                    params.position = {
                        x: getRangeVal(`posX_${type}`, 0),
                        y: getRangeVal(`posY_${type}`, 0),
                        z: getRangeVal(`posZ_${type}`, 0)
                    };
                    const g = pieceGroups[type];
                    if (g) g.position.set(params.position.x, params.position.y, params.position.z);
                };
                bindRange(`posX_${type}`, updatePiecePos);
                bindRange(`posY_${type}`, updatePiecePos);
                bindRange(`posZ_${type}`, updatePiecePos);

                // 部件變換
                const updatePart = () => {
                    if (!selectedPart || selectedPart.type !== type) return;
                    const mesh = getPartMesh(type, selectedPart.partId);
                    if (!mesh) return;
                    mesh.position.set(
                        getRangeVal(`partX_${type}`, 0),
                        getRangeVal(`partY_${type}`, 0),
                        getRangeVal(`partZ_${type}`, 0)
                    );
                    mesh.rotation.set(
                        getRangeVal(`partRX_${type}`, 0),
                        getRangeVal(`partRY_${type}`, 0),
                        getRangeVal(`partRZ_${type}`, 0)
                    );
                    mesh.scale.set(
                        getRangeVal(`partSX_${type}`, 1),
                        getRangeVal(`partSY_${type}`, 1),
                        getRangeVal(`partSZ_${type}`, 1)
                    );
                    writePartTransform(type, selectedPart.partId, mesh);
                };

                ['partX', 'partY', 'partZ', 'partRX', 'partRY', 'partRZ', 'partSX', 'partSY', 'partSZ']
                .forEach(prefix => bindRange(`${prefix}_${type}`, updatePart));

                document.getElementById(`partControls_${type}`).style.display = 'none';
            }

            setGizmoMode(gizmoMode);
            const first = document.querySelector('.accordion-item');
            if (first) first.classList.add('active');

            updatePartsListUI();
        }

        // ============================================================
        //  7. 部件列表與選擇
        // ============================================================
        function updatePartsListUI() {
            for (const type of PIECE_TYPES) {
                const list = document.getElementById(`partsList_${type}`);
                if (!list) continue;
                list.innerHTML = '';
                const group = pieceGroups[type];
                if (!group) continue;
                const parts = group.userData.parts || {};
                const partIds = Object.keys(parts);
                if (partIds.length === 0) {
                    list.innerHTML = '<span style="font-size:0.7rem;opacity:0.4;">無部件</span>';
                    continue;
                }
                for (const [id, mesh] of Object.entries(parts)) {
                    const tag = document.createElement('span');
                    tag.className = 'part-tag';
                    if (selectedPart && selectedPart.type === type && selectedPart.partId === id) {
                        tag.classList.add('active');
                    }
                    const name = mesh.userData.partName || id;
                    tag.textContent = name;
                    tag.title = id;

                    // ✎ 重新命名（內建 + 自定義都可用）
                    const renameBtn = document.createElement('span');
                    renameBtn.className = 'rename-part';
                    renameBtn.textContent = '✎';
                    renameBtn.title = '重新命名';
                    renameBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        renamePart(type, id);
                    });
                    tag.appendChild(renameBtn);

                    // 📋 複製部件
                    const cloneBtn = document.createElement('span');
                    cloneBtn.className = 'clone-part';
                    cloneBtn.textContent = '📋';
                    cloneBtn.title = '複製部件';
                    cloneBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        clonePart(type, id);
                    });
                    tag.appendChild(cloneBtn);

                    // ✕ 刪除部件（★ 現在所有部件都可刪除）
                    const del = document.createElement('span');
                    del.className = 'del-part';
                    del.textContent = '✕';
                    del.title = '刪除部件';
                    del.addEventListener('click', (e) => {
                        e.stopPropagation();
                        deletePart(type, id);
                    });
                    tag.appendChild(del);

                    tag.addEventListener('click', () => {
                        selectPart(type, id);
                    });
                    list.appendChild(tag);
                }
            }
            updatePartControls();
        }

        function selectPart(type, partId) {
            selectedPart = { type, partId };
            document.querySelectorAll('.parts-list').forEach(list => {
                list.querySelectorAll('.part-tag').forEach(tag => {
                    tag.classList.remove('active');
                });
            });
            const list = document.getElementById(`partsList_${type}`);
            if (list) {
                const tags = list.querySelectorAll('.part-tag');
                for (const tag of tags) {
                    if (tag.title === partId) {
                        tag.classList.add('active');
                        break;
                    }
                }
            }
            const controls = document.getElementById(`partControls_${type}`);
            if (controls) controls.style.display = 'block';

            const mesh = getPartMesh(type, partId);
            const nameSpan = document.getElementById(`selectedPartName_${type}`);
            if (nameSpan) nameSpan.textContent = mesh ? (mesh.userData.partName || partId) : '未知';

            const item = document.querySelector(`.accordion-item[data-type="${type}"]`);
            if (item && !item.classList.contains('active')) {
                document.querySelectorAll('.accordion-item').forEach(el => el.classList.remove('active'));
                item.classList.add('active');
            }

            syncPartInputs(type);
            highlightPart(type, partId);
            attachGizmo();
        }

        function getPartMesh(type, partId) {
            const group = pieceGroups[type];
            if (!group) return null;
            return group.userData.parts[partId] || null;
        }

        function highlightPart(type, partId) {
            for (const t of PIECE_TYPES) {
                const g = pieceGroups[t];
                if (!g) continue;
                for (const [id, mesh] of Object.entries(g.userData.parts || {})) {
                    if (mesh.material && mesh.material.emissive) {
                        mesh.material.emissive.setHex(0x000000);
                    }
                }
            }
            const mesh = getPartMesh(type, partId);
            if (mesh && mesh.material && mesh.material.emissive) {
                mesh.material.emissive.setHex(0xe8c547);
                mesh.material.emissiveIntensity = 0.3;
            }
        }

        function updatePartControls() {
            for (const type of PIECE_TYPES) {
                const controls = document.getElementById(`partControls_${type}`);
                if (!controls) continue;
                controls.style.display = (selectedPart && selectedPart.type === type) ? 'block' : 'none';
            }
        }

        // ============================================================
        //  8. 添加/複製/刪除/重命名 部件
        // ============================================================
        function addPartToPiece(type) {
            const select = document.getElementById(`addPartType_${type}`);
            const shapeType = select.value;
            const params = currentParams[type];
            if (!params.parts) params.parts = {};

            const id = 'custom_' + (partIdCounter++);
            let geoParams = {};
            switch (shapeType) {
                case 'box': geoParams = { width: 0.2, height: 0.2, depth: 0.2 }; break;
                case 'sphere': geoParams = { radius: 0.15 }; break;
                case 'cylinder': geoParams = { radiusTop: 0.15, radiusBottom: 0.15, height: 0.3 }; break;
                case 'cone': geoParams = { radius: 0.15, height: 0.3 }; break;
                case 'torus': geoParams = { radius: 0.15, tube: 0.05 }; break;
                default: geoParams = { width: 0.2, height: 0.2, depth: 0.2 };
            }

            const partData = {
                type: shapeType,
                geometryParams: geoParams,
                roughness: 0.5,
                metalness: 0.2,
                position: { x: 0, y: 0.2, z: 0 },
                rotation: { x: 0, y: 0, z: 0 },
                scale: { x: 1, y: 1, z: 1 },
                name: shapeType.charAt(0).toUpperCase() + shapeType.slice(1),
            };
            params.parts[id] = partData;

            const group = pieceGroups[type];
            if (group) {
                const geo = createGeometry(partData.type, partData.geometryParams);
                const mat = createCustomPartMaterial(partData, params);
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(partData.position.x, partData.position.y, partData.position.z);
                mesh.rotation.set(partData.rotation.x, partData.rotation.y, partData.rotation.z);
                mesh.scale.set(partData.scale.x, partData.scale.y, partData.scale.z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                mesh.userData.partKey = id;
                mesh.userData.partName = partData.name;
                mesh.userData.isCustom = true;
                group.add(mesh);
                group.userData.parts[id] = mesh;
            }

            updatePartsListUI();
            selectPart(type, id);
            pushHistory(true);   // ★ 添加部件 → 記錄歷史
            showToast('✅ 已添加 ' + partData.name);
        }

        function inferGeometryInfo(mesh) {
            const geo = mesh.geometry;
            if (!geo) return null;
            const p = geo.parameters || {};
            switch (geo.type) {
                case 'BoxGeometry':
                    return { type: 'box', geometryParams: { width: p.width, height: p.height, depth: p.depth } };
                case 'SphereGeometry':
                    return { type: 'sphere', geometryParams: { radius: p.radius } };
                case 'CylinderGeometry':
                    return {
                        type: 'cylinder',
                        geometryParams: { radiusTop: p.radiusTop, radiusBottom: p.radiusBottom, height: p.height }
                    };
                case 'ConeGeometry':
                    return { type: 'cone', geometryParams: { radius: p.radius, height: p.height } };
                case 'TorusGeometry':
                    return { type: 'torus', geometryParams: { radius: p.radius, tube: p.tube } };
                default:
                    return null;
            }
        }

        function clonePart(type, partId) {
            const params = currentParams[type];
            const group = pieceGroups[type];
            if (!group) {
                showToast('⚠️ 找不到棋子');
                return;
            }

            const sourceMesh = getPartMesh(type, partId);
            if (!sourceMesh) {
                showToast('⚠️ 找不到該部件');
                return;
            }

            const newId = 'custom_' + (partIdCounter++);

            const newMaterial = sourceMesh.material
                ? sourceMesh.material.clone()
                : new THREE.MeshStandardMaterial({ color: params.color || '#f5f0e1' });
            if (newMaterial.emissive) {
                newMaterial.emissive.setHex(0x000000);
                newMaterial.emissiveIntensity = 1;
            }

            const newMesh = new THREE.Mesh(sourceMesh.geometry, newMaterial);
            newMesh.position.copy(sourceMesh.position);
            newMesh.rotation.copy(sourceMesh.rotation);
            newMesh.scale.copy(sourceMesh.scale);
            newMesh.castShadow = true;
            newMesh.receiveShadow = true;
            newMesh.userData.partKey = newId;
            newMesh.userData.partName = (sourceMesh.userData.partName || '部件') + ' Copy';
            newMesh.userData.isCustom = true;

            group.add(newMesh);
            group.userData.parts[newId] = newMesh;

            if (!params.parts) params.parts = {};

            const sourceData = params.parts[partId];
            let newData;

            if (sourceData && sourceData.type) {
                newData = JSON.parse(JSON.stringify(sourceData));
            } else {
                const geoInfo = inferGeometryInfo(sourceMesh);
                if (!geoInfo) {
                    showToast('⚠️ 此部件無法複製（幾何體無法辨識）');
                    group.remove(newMesh);
                    delete group.userData.parts[newId];
                    return;
                }
                newData = {
                    type: geoInfo.type,
                    geometryParams: geoInfo.geometryParams,
                    roughness: (sourceMesh.material && sourceMesh.material.roughness) ?? 0.5,
                    metalness: (sourceMesh.material && sourceMesh.material.metalness) ?? 0.2,
                };
            }

            delete newData.deleted;   // ★ 複製體一定不會是「已刪除」

            newData.position = { x: sourceMesh.position.x, y: sourceMesh.position.y, z: sourceMesh.position.z };
            newData.rotation = { x: sourceMesh.rotation.x, y: sourceMesh.rotation.y, z: sourceMesh.rotation.z };
            newData.scale = { x: sourceMesh.scale.x, y: sourceMesh.scale.y, z: sourceMesh.scale.z };
            newData.name = newMesh.userData.partName;

            params.parts[newId] = newData;

            updatePartsListUI();
            selectPart(type, newId);
            pushHistory(true);   // ★ 複製部件 → 記錄歷史
            const total = Object.keys(group.userData.parts).length;
            showToast('📋 已複製 ' + (sourceMesh.userData.partName || '部件') + `（共 ${total} 個部件）`);
        }

        // ★ 刪除部件（內建部件以 deleted 標記處理）
        function deletePart(type, partId) {
            const mesh = getPartMesh(type, partId);
            if (!mesh) {
                showToast('⚠️ 找不到該部件');
                return;
            }
            const displayName = mesh.userData.partName || partId;
            if (!confirm(`確定刪除部件「${displayName}」嗎？`)) return;

            const params = currentParams[type];
            if (!params.parts) params.parts = {};

            const isCustom = mesh.userData.isCustom === true;
            if (isCustom) {
                // 自定義部件：直接從參數移除
                delete params.parts[partId];
            } else {
                // ★ 內建部件：留下 deleted 標記，重建時就不再生成
                params.parts[partId] = { deleted: true };
            }

            const group = pieceGroups[type];
            if (group) {
                group.remove(mesh);
                delete group.userData.parts[partId];
            }

            if (selectedPart && selectedPart.type === type && selectedPart.partId === partId) {
                selectedPart = null;
                if (transformControls) transformControls.detach();
            }
            updatePartsListUI();
            updatePartControls();
            pushHistory(true);   // ★ 刪除部件 → 記錄歷史
            showToast('🗑 已刪除部件「' + displayName + '」');
        }

        // ★ 重新命名部件（內建 / 自定義皆可）
        function renamePart(type, partId) {
            const mesh = getPartMesh(type, partId);
            if (!mesh) {
                showToast('⚠️ 找不到該部件');
                return;
            }
            const currentName = mesh.userData.partName || partId;
            const input = prompt('請輸入新的部件名稱：', currentName);
            if (input === null) return;               // 使用者取消
            const newName = input.trim();
            if (!newName) {
                showToast('⚠️ 名稱不能為空');
                return;
            }
            if (newName === currentName) return;

            const params = currentParams[type];
            if (!params.parts) params.parts = {};
            if (!params.parts[partId]) params.parts[partId] = {};
            params.parts[partId].name = newName;

            mesh.userData.partName = newName;

            if (selectedPart && selectedPart.type === type && selectedPart.partId === partId) {
                const nameSpan = document.getElementById(`selectedPartName_${type}`);
                if (nameSpan) nameSpan.textContent = newName;
            }

            updatePartsListUI();
            pushHistory(true);   // ★ 重命名 → 記錄歷史
            showToast('✏️ 已重新命名為「' + newName + '」');
        }

        // ============================================================
        //  9. 重置功能
        // ============================================================
        function resetPiece(type) {
            currentParams[type] = JSON.parse(JSON.stringify(DEFAULT_PARAMS[type]));
            const wasActive = document.querySelector(`.accordion-item[data-type="${type}"]`)?.classList.contains('active');
            if (selectedPart && selectedPart.type === type) selectedPart = null;
            buildPanel();
            if (wasActive) {
                const item = document.querySelector(`.accordion-item[data-type="${type}"]`);
                if (item) item.classList.add('active');
            }
            rebuildAllPieces();
            updatePartsListUI();
            updatePartControls();
            pushHistory(true);   // ★ 重置棋子 → 記錄歷史
        }

        function resetAll() {
            if (!confirm('確定重置所有棋子？')) return;
            currentParams = JSON.parse(JSON.stringify(DEFAULT_PARAMS));
            selectedPart = null;
            if (transformControls) transformControls.detach();
            buildPanel();
            rebuildAllPieces();
            const first = document.querySelector('.accordion-item');
            if (first) first.classList.add('active');
            updatePartsListUI();
            updatePartControls();
            pushHistory(true);   // ★ 重置全部 → 記錄歷史
            showToast('↺ 已重置');
        }

        // ============================================================
        //  10. 全局工具
        // ============================================================
        function resetAllPositions() {
            for (const type of PIECE_TYPES) {
                const def = DEFAULT_PARAMS[type];
                currentParams[type].position = { ...def.position };
            }
            rebuildAllPieces();
            refreshPanelPositions();
            pushHistory(true);   // ★ 重置位置 → 記錄歷史
            showToast('↺ 位置已重置');
        }

        function arrangeInRow() {
            const count = PIECE_TYPES.length;
            const spacing = 1.68;
            const startX = -(count - 1) * spacing / 2;
            for (let i = 0; i < count; i++) {
                const type = PIECE_TYPES[i];
                const yOffset = { pawn: 0, rook: 0.02, knight: 0.02, bishop: 0.02, queen: 0.03, king: 0.04 };
                currentParams[type].position = { x: startX + i * spacing, y: yOffset[type] || 0, z: 0 };
            }
            rebuildAllPieces();
            refreshPanelPositions();
            pushHistory(true);   // ★ 排列 → 記錄歷史
            showToast('➡ 已排列');
        }

        function randomizePositions() {
            for (const type of PIECE_TYPES) {
                const yOffset = { pawn: 0, rook: 0.02, knight: 0.02, bishop: 0.02, queen: 0.03, king: 0.04 };
                currentParams[type].position = {
                    x: (Math.random() - 0.5) * 8,
                    y: (yOffset[type] || 0) + (Math.random() - 0.5) * 0.6,
                    z: (Math.random() - 0.5) * 6
                };
            }
            rebuildAllPieces();
            refreshPanelPositions();
            pushHistory(true);   // ★ 隨機位置 → 記錄歷史
            showToast('🎲 隨機位置');
        }

        function refreshPanelPositions() {
            for (const type of PIECE_TYPES) {
                const pos = currentParams[type].position;
                const setVal = (id, v) => {
                    const range = document.getElementById(id);
                    const num = document.getElementById(id + '_num');
                    if (!range) return;
                    const dec = decimalsFor(parseFloat(range.step) || 0.02);
                    range.value = v;
                    if (num) num.value = Number(v).toFixed(dec);
                };
                setVal(`posX_${type}`, pos.x);
                setVal(`posY_${type}`, pos.y);
                setVal(`posZ_${type}`, pos.z);
            }
        }

        // ============================================================
        //  11. 匯出 & 匯入
        // ============================================================
        function exportCode() {
            const modal = document.getElementById('exportModal');
            const area = document.getElementById('exportCodeArea');
            let code = `const PIECE_PARAMS = ${JSON.stringify(currentParams, null, 2)};`;
            area.value = code;
            modal.classList.add('open');
        }

        function closeExport() {
            document.getElementById('exportModal').classList.remove('open');
        }

        function copyExport() {
            const area = document.getElementById('exportCodeArea');
            navigator.clipboard.writeText(area.value).then(() => {
                showToast('✅ 已複製');
            }).catch(() => {
                area.select();
                document.execCommand('copy');
                showToast('✅ 已複製');
            });
        }

        function openImportModal() {
            document.getElementById('importModal').classList.add('open');
            document.getElementById('importCodeArea').value = '';
        }

        function closeImport() {
            document.getElementById('importModal').classList.remove('open');
        }

        function doImport() {
            const area = document.getElementById('importCodeArea');
            let raw = area.value.trim();
            if (!raw) {
                showToast('⚠️ 請貼上 JSON 代碼');
                return;
            }

            let jsonStr = raw;
            const assignMatch = raw.match(/PIECE_PARAMS\s*=\s*({[\s\S]*});?/);
            if (assignMatch) {
                jsonStr = assignMatch[1];
            }

            try {
                const imported = JSON.parse(jsonStr);
                const required = ['pawn', 'rook', 'knight', 'bishop', 'queen', 'king'];
                const allPresent = required.every(t => imported[t]);
                if (!allPresent) {
                    showToast('❌ 缺少必要的棋子類型 (pawn, rook, knight, bishop, queen, king)');
                    return;
                }
                currentParams = imported;
                selectedPart = null;
                if (transformControls) transformControls.detach();

                partIdCounter = 1000;
                for (const t of PIECE_TYPES) {
                    const parts = imported[t] && imported[t].parts;
                    if (!parts) continue;
                    for (const id of Object.keys(parts)) {
                        const m = /^custom_(\d+)$/.exec(id);
                        if (m) {
                            const n = parseInt(m[1], 10);
                            if (n >= partIdCounter) partIdCounter = n + 1;
                        }
                    }
                }

                buildPanel();
                rebuildAllPieces();
                const first = document.querySelector('.accordion-item');
                if (first) first.classList.add('active');
                closeImport();
                pushHistory(true);   // ★ 匯入 → 記錄歷史
                showToast('✅ 匯入成功！');
            } catch (e) {
                showToast('❌ JSON 解析錯誤: ' + e.message);
            }
        }

        // ============================================================
        //  12. 撤銷 / 重做 (歷史記錄)
        // ============================================================
        let historyStack = [];
        let historyIndex = -1;
        let historyTimer = null;
        let historyPaused = false;
        const HISTORY_LIMIT = 80;

        function captureState() {
            return {
                params: JSON.parse(JSON.stringify(currentParams)),
                selectedPart: selectedPart ? { ...selectedPart } : null
            };
        }

        // 記錄一步（immediate=true 立即記錄；否則延遲 350ms 合併連續拖曳）
        function pushHistory(immediate = false) {
            if (historyPaused) return;

            const run = () => {
                const snap = captureState();

                // 丟棄「未來」的分支（撤銷後又做新修改的情況）
                historyStack = historyStack.slice(0, historyIndex + 1);

                // 避免重複記錄同一狀態
                if (historyStack.length > 0) {
                    const last = historyStack[historyStack.length - 1];
                    if (JSON.stringify(last.params) === JSON.stringify(snap.params)) {
                        updateUndoRedoButtons();
                        return;
                    }
                }

                historyStack.push(snap);
                if (historyStack.length > HISTORY_LIMIT) {
                    historyStack.shift();
                }
                historyIndex = historyStack.length - 1;
                updateUndoRedoButtons();
            };

            if (immediate) {
                clearTimeout(historyTimer);
                run();
            } else {
                clearTimeout(historyTimer);
                historyTimer = setTimeout(run, 350);
            }
        }

        // 確保「當前狀態」已被記錄（撤銷/重做前呼叫）
        function ensureCurrentStateSaved() {
            const cur = captureState();
            if (historyStack.length === 0) {
                historyStack.push(cur);
                historyIndex = 0;
                return;
            }
            const stored = historyStack[historyIndex];
            if (!stored || JSON.stringify(stored.params) !== JSON.stringify(cur.params)) {
                historyStack = historyStack.slice(0, historyIndex + 1);
                historyStack.push(cur);
                historyIndex = historyStack.length - 1;
            }
        }

        function undo() {
            clearTimeout(historyTimer);
            ensureCurrentStateSaved();
            if (historyIndex <= 0) {
                showToast('已到最早狀態');
                return;
            }
            historyIndex--;
            restoreState(historyStack[historyIndex]);
            showToast('↶ 撤銷 (' + (historyIndex + 1) + '/' + historyStack.length + ')');
        }

        function redo() {
            clearTimeout(historyTimer);
            ensureCurrentStateSaved();
            if (historyIndex >= historyStack.length - 1) {
                showToast('已到最新狀態');
                return;
            }
            historyIndex++;
            restoreState(historyStack[historyIndex]);
            showToast('↷ 重做 (' + (historyIndex + 1) + '/' + historyStack.length + ')');
        }

        function restoreState(snap) {
            historyPaused = true;

            currentParams = JSON.parse(JSON.stringify(snap.params));
            selectedPart = snap.selectedPart ? { ...snap.selectedPart } : null;

            buildPanel();
            rebuildAllPieces();

            // ★ 若選中的部件在重建後不存在（例如被刪除），清空選擇
            if (selectedPart && !getPartMesh(selectedPart.type, selectedPart.partId)) {
                selectedPart = null;
                if (transformControls) transformControls.detach();
            }

            // 展開對應的棋子手風琴
            const typeToOpen = selectedPart ? selectedPart.type : 'pawn';
            document.querySelectorAll('.accordion-item').forEach(el => el.classList.remove('active'));
            const item = document.querySelector(`.accordion-item[data-type="${typeToOpen}"]`);
            if (item) item.classList.add('active');

            updatePartsListUI();
            updatePartControls();
            if (selectedPart) {
                syncPartInputs(selectedPart.type);
                highlightPart(selectedPart.type, selectedPart.partId);
                attachGizmo();
            }

            historyPaused = false;
            updateUndoRedoButtons();
        }

        function updateUndoRedoButtons() {
            const undoBtn = document.getElementById('undoBtn');
            const redoBtn = document.getElementById('redoBtn');
            if (undoBtn) undoBtn.disabled = historyIndex <= 0;
            if (redoBtn) redoBtn.disabled = historyIndex >= historyStack.length - 1;
        }

        // ============================================================
        //  13. Toast
        // ============================================================
        function showToast(msg) {
            const toast = document.getElementById('copyToast');
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // ============================================================
        //  14. 鍵盤快捷鍵
        // ============================================================
        window.addEventListener('keydown', (e) => {
            const tag = (e.target && e.target.tagName || '').toLowerCase();
            const isEditing = tag === 'input' || tag === 'textarea' || tag === 'select';

            // Ctrl+Z / Ctrl+Shift+Z / Ctrl+Y  →  撤銷 / 重做
            if ((e.ctrlKey || e.metaKey) && !e.altKey) {
                const k = e.key.toLowerCase();
                if (k === 'z') {
                    e.preventDefault();
                    if (e.shiftKey) redo();
                    else undo();
                    return;
                }
                if (k === 'y') {
                    e.preventDefault();
                    redo();
                    return;
                }
            }

            if (isEditing) return;
            if (!selectedPart) return;

            // G / R / S  →  gizmo 模式
            const k = e.key.toLowerCase();
            if (k === 'g') setGizmoMode('translate');
            else if (k === 'r') setGizmoMode('rotate');
            else if (k === 's') setGizmoMode('scale');
        });

        // ============================================================
        //  15. 初始化
        // ============================================================
        function init() {
            initScene();
            initTransformControls();
            buildPanel();
            rebuildAllPieces();
            const first = document.querySelector('.accordion-item');
            if (first) first.classList.add('active');

            // 初始狀態推入歷史
            historyStack = [];
            historyIndex = -1;
            pushHistory(true);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

        // 暴露全局函數
        window.resetAll = resetAll;
        window.exportCode = exportCode;
        window.closeExport = closeExport;
        window.copyExport = copyExport;
        window.openImportModal = openImportModal;
        window.closeImport = closeImport;
        window.doImport = doImport;
        window.resetPiece = resetPiece;
        window.resetAllPositions = resetAllPositions;
        window.arrangeInRow = arrangeInRow;
        window.randomizePositions = randomizePositions;
        window.addPartToPiece = addPartToPiece;
        window.clonePart = clonePart;
        window.deletePart = deletePart;
        window.renamePart = renamePart;
        window.selectPart = selectPart;
        window.setGizmoMode = setGizmoMode;
        window.toggleGizmoSpace = toggleGizmoSpace;
        window.undo = undo;
        window.redo = redo;
        window.showToast = showToast;
    </script>
</body>

</html>
