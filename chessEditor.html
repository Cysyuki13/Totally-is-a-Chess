<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>♟ 棋子模型編輯器（部件級 + 3D 拖曳 + 撤銷/重做）</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            background: #1a1a2e;
            color: #f0e6d3;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a2e;
        }

        ::-webkit-scrollbar-thumb {
            background: #e8c547;
            border-radius: 4px;
        }

        #topBar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 24px;
            background: rgba(22, 33, 62, 0.92);
            backdrop-filter: blur(6px);
            border-bottom: 2px solid #e8c547;
            z-index: 20;
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 8px;
        }

        #topBar h1 {
            font-size: 1.3rem;
            color: #e8c547;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #topBar h1 small {
            font-size: 0.7rem;
            opacity: 0.6;
            font-weight: 400;
            letter-spacing: 0;
        }

        .top-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            background: #e8c547;
            color: #1a1a2e;
            box-shadow: 0 2px 10px rgba(232, 197, 71, 0.25);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 18px rgba(232, 197, 71, 0.4);
        }

        .btn:disabled {
            opacity: 0.32;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-secondary {
            background: #3a3a5c;
            color: #f0e6d3;
            box-shadow: none;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #4a4a6c;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.3);
        }

        .btn-danger {
            background: #e74c3c;
            color: #fff;
            box-shadow: 0 2px 10px rgba(231, 76, 60, 0.25);
        }

        .btn-danger:hover:not(:disabled) {
            background: #ff6b5e;
        }

        .btn-success {
            background: #2ecc71;
            color: #1a1a2e;
            box-shadow: 0 2px 10px rgba(46, 204, 113, 0.25);
        }

        .btn-success:hover:not(:disabled) {
            background: #55ef9a;
        }

        .btn-warning {
            background: #f39c12;
            color: #1a1a2e;
            box-shadow: 0 2px 10px rgba(243, 156, 18, 0.25);
        }

        .btn-warning:hover:not(:disabled) {
            background: #f1c40f;
        }

        .btn-sm {
            padding: 4px 12px;
            font-size: 0.7rem;
        }

        #main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        #sceneContainer {
            flex: 1;
            position: relative;
            background: #12121f;
            overflow: hidden;
            min-width: 0;
        }

        #sceneContainer canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        #sceneHint {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: #aaa;
            pointer-events: none;
            white-space: nowrap;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        #panel {
            width: 430px;
            min-width: 340px;
            max-width: 520px;
            background: rgba(22, 33, 62, 0.95);
            backdrop-filter: blur(6px);
            border-left: 2px solid #e8c547;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
        }

        #panelHeader {
            padding: 14px 20px 10px;
            border-bottom: 1px solid rgba(232, 197, 71, 0.2);
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #panelHeader h2 {
            font-size: 1rem;
            color: #e8c547;
            letter-spacing: 1px;
        }

        #panelHeader .badge {
            font-size: 0.65rem;
            background: rgba(232, 197, 71, 0.15);
            padding: 2px 12px;
            border-radius: 12px;
            color: #e8c547;
        }

        #panelBody {
            flex: 1;
            overflow-y: auto;
            padding: 8px 16px 24px;
        }

        /* 摺疊面板 */
        .accordion-item {
            margin: 6px 0;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            overflow: hidden;
            transition: border-color 0.2s;
        }

        .accordion-item.active {
            border-color: rgba(232, 197, 71, 0.5);
            box-shadow: 0 0 20px rgba(232, 197, 71, 0.05);
        }

        .accordion-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            cursor: pointer;
            user-select: none;
            transition: background 0.15s;
            gap: 12px;
        }

        .accordion-header:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .accordion-header .piece-icon {
            font-size: 1.4rem;
            width: 32px;
            text-align: center;
        }

        .accordion-header .piece-name {
            font-weight: 700;
            font-size: 0.95rem;
            flex: 1;
        }

        .accordion-header .piece-color-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
        }

        .accordion-header .arrow {
            transition: transform 0.25s;
            font-size: 0.7rem;
            opacity: 0.5;
        }

        .accordion-item.active .accordion-header .arrow {
            transform: rotate(180deg);
        }

        .accordion-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease;
            padding: 0 16px;
        }

        .accordion-item.active .accordion-body {
            max-height: 2400px;
            padding: 0 16px 16px;
            overflow-y: auto;
        }

        /* 參數控制 */
        .param-group {
            margin: 6px 0 2px;
            min-width: 0;
        }

        .param-group .param-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 4px;
            font-size: 0.72rem;
            opacity: 0.75;
            margin-bottom: 2px;
            white-space: nowrap;
        }

        .param-group .param-label > span:first-child {
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .param-group input[type="range"] {
            width: 100%;
            height: 3px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            outline: none;
        }

        .param-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #e8c547;
            cursor: pointer;
            border: 2px solid #1a1a2e;
        }

        .param-group input[type="range"]::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #e8c547;
            cursor: pointer;
            border: 2px solid #1a1a2e;
        }

        .param-group input[type="color"] {
            width: 100%;
            height: 30px;
            border: none;
            border-radius: 6px;
            background: transparent;
            cursor: pointer;
            padding: 0;
        }

        .param-group input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 2px;
        }

        .param-group input[type="color"]::-webkit-color-swatch {
            border-radius: 6px;
            border: 2px solid rgba(255, 255, 255, 0.15);
        }

        /* ★ 可輸入數值框 */
        .num-input {
            width: 54px;
            flex-shrink: 0;
            background: #0f0f1a;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 4px;
            color: #e8c547;
            font-family: inherit;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 1px 4px;
            text-align: right;
            outline: none;
            -moz-appearance: textfield;
            appearance: textfield;
        }

        .num-input::-webkit-outer-spin-button,
        .num-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .num-input:focus {
            border-color: #e8c547;
            background: #16162a;
            box-shadow: 0 0 0 2px rgba(232, 197, 71, 0.15);
        }

        .param-row,
        .pos-row {
            display: flex;
            gap: 8px;
        }

        .param-row .param-group,
        .pos-row .param-group {
            flex: 1;
            min-width: 0;
        }

        .pos-title {
            font-size: 0.7rem;
            opacity: 0.5;
            margin: 10px 0 2px;
            letter-spacing: 1px;
        }

        /* ★ Gizmo 模式切換 */
        .gizmo-modes {
            display: flex;
            gap: 4px;
            margin-bottom: 8px;
        }

        .gizmo-btn {
            flex: 1;
            padding: 5px 2px;
            font-size: 0.66rem;
            font-family: inherit;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.06);
            color: #cfc7b5;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }

        .gizmo-btn:hover {
            background: rgba(255, 255, 255, 0.13);
        }

        .gizmo-btn.active {
            background: rgba(232, 197, 71, 0.2);
            border-color: #e8c547;
            color: #e8c547;
            box-shadow: 0 0 10px rgba(232, 197, 71, 0.2);
        }

        /* 部件列表 */
        .parts-list {
            margin: 8px 0 4px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .parts-list .part-tag {
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
        }

        .parts-list .part-tag:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .parts-list .part-tag.active {
            border-color: #e8c547;
            background: rgba(232, 197, 71, 0.15);
            color: #e8c547;
        }

        .parts-list .part-tag .del-part {
            margin-left: 6px;
            color: #e74c3c;
            cursor: pointer;
            opacity: 0.6;
        }

        .parts-list .part-tag .del-part:hover {
            opacity: 1;
        }

        .parts-list .part-tag .clone-part {
            margin-left: 6px;
            color: #e8c547;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.15s;
        }

        .parts-list .part-tag .clone-part:hover {
            opacity: 1;
        }

        /* ★ 重新命名按鈕 */
        .parts-list .part-tag .rename-part {
            margin-left: 6px;
            color: #4fc3f7;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.15s;
        }

        .parts-list .part-tag .rename-part:hover {
            opacity: 1;
        }

        /* 添加部件 */
        .add-part-row {
            display: flex;
            gap: 6px;
            margin-top: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .add-part-row select {
            flex: 1;
            min-width: 80px;
            background: #0f0f1a;
            color: #f0e6d3;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 0.75rem;
            outline: none;
            cursor: pointer;
        }

        .add-part-row select:focus {
            border-color: #e8c547;
        }

        .add-part-row .btn {
            padding: 4px 12px;
            font-size: 0.7rem;
        }

        /* 響應式 */
        @media (max-width: 820px) {
            #panel {
                width: 320px;
                min-width: 200px;
            }

            #topBar h1 {
                font-size: 1rem;
            }

            .btn {
                padding: 6px 12px;
                font-size: 0.75rem;
            }

            .accordion-header .piece-icon {
                font-size: 1.1rem;
                width: 24px;
            }

            .accordion-header .piece-name {
                font-size: 0.8rem;
            }

            .num-input {
                width: 48px;
                font-size: 0.65rem;
            }
        }

        @media (max-width: 640px) {
            #main {
                flex-direction: column;
            }

            #panel {
                width: 100%;
                max-width: 100%;
                border-left: none;
                border-top: 2px solid #e8c547;
                height: 50vh;
                min-height: 300px;
            }

            #sceneContainer {
                height: 50vh;
                min-height: 200px;
            }

            #sceneHint {
                bottom: 8px;
                font-size: 0.6rem;
                padding: 4px 12px;
                white-space: normal;
            }
        }

        @media (max-width: 480px) {
            #topBar {
                padding: 6px 12px;
            }

            #topBar h1 {
                font-size: 0.85rem;
            }

            .btn {
                padding: 4px 10px;
                font-size: 0.7rem;
            }

            #panelBody {
                padding: 4px 8px 12px;
            }

            .accordion-body {
                padding: 0 8px;
            }

            .accordion-item.active .accordion-body {
                padding: 0 8px 16px;
            }

            .param-group .param-label {
                font-size: 0.63rem;
            }

            .num-input {
                width: 42px;
                font-size: 0.6rem;
            }

            .parts-list .part-tag {
                font-size: 0.6rem;
                padding: 1px 8px;
            }
        }

        /* 匯出 / 匯入 模態框共用樣式 */
        .modal-box {
            background: #1a1a2e;
            border: 2px solid #e8c547;
            border-radius: 16px;
            padding: 28px 32px;
            max-width: 720px;
            width: 92%;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        .modal-box h2 {
            color: #e8c547;
            margin-bottom: 12px;
            font-size: 1.2rem;
        }

        .modal-box textarea {
            flex: 1;
            min-height: 280px;
            background: #0f0f1a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #d4d4d4;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            padding: 14px;
            resize: vertical;
            outline: none;
            tab-size: 2;
            line-height: 1.5;
        }

        .modal-box textarea:focus {
            border-color: #e8c547;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 14px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .modal-actions .btn {
            padding: 10px 24px;
        }

        #exportModal,
        #importModal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 999;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
        }

        #exportModal.open,
        #importModal.open {
            display: flex;
        }

        .copy-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2ecc71;
            color: #1a1a2e;
            padding: 10px 28px;
            border-radius: 12px;
            font-weight: 700;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            box-shadow: 0 8px 30px rgba(46, 204, 113, 0.3);
        }

        .copy-toast.show {
            opacity: 1;
        }
    </style>
</head>

<body>

    <div id="topBar">
        <h1>
            ♟ 棋子編輯器 <small>部件級拖曳・可輸入數值・撤銷/重做</small>
        </h1>
        <div class="top-actions">
            <button class="btn btn-secondary" id="undoBtn" onclick="undo()" title="撤銷 (Ctrl+Z)" disabled>↶ 撤銷</button>
            <button class="btn btn-secondary" id="redoBtn" onclick="redo()" title="重做 (Ctrl+Shift+Z)" disabled>↷ 重做</button>
            <button class="btn btn-secondary" onclick="resetAll()">↺ 重置</button>
            <button class="btn btn-warning" onclick="openImportModal()">📥 匯入</button>
            <button class="btn btn-success" onclick="exportCode()">📤 匯出</button>
        </div>
    </div>

    <div id="main">
        <div id="sceneContainer">
            <div id="sceneHint">🖱 左鍵旋轉 · 滾輪縮放 · 右鍵平移 · 拖曳箭頭移動部件 · G/R/S 模式 · Ctrl+Z 撤銷</div>
        </div>
        <div id="panel">
            <div id="panelHeader">
                <h2>⚙ 參數調整</h2>
                <span class="badge">即時預覽</span>
            </div>
            <div id="panelBody"></div>
        </div>
    </div>

    <!-- 匯出模態框 -->
    <div id="exportModal">
        <div class="modal-box">
            <h2>📤 匯出棋子模型代碼</h2>
            <p style="opacity:0.6;font-size:0.85rem;margin-bottom:12px;">
                複製下方代碼，替換原 <code style="background:#2a2a4a;padding:2px 8px;border-radius:4px;">PIECE_PARAMS</code>
            </p>
            <textarea id="exportCodeArea" spellcheck="false"></textarea>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeExport()">關閉</button>
                <button class="btn btn-success" onclick="copyExport()">📋 複製</button>
            </div>
        </div>
    </div>

    <!-- 匯入模態框 -->
    <div id="importModal">
        <div class="modal-box">
            <h2>📥 匯入棋子參數</h2>
            <p style="opacity:0.6;font-size:0.85rem;margin-bottom:12px;">
                貼上從編輯器匯出的 JSON 代碼（可包含 <code
                    style="background:#2a2a4a;padding:2px 8px;border-radius:4px;">const PIECE_PARAMS = </code> 前綴）
            </p>
            <textarea id="importCodeArea" spellcheck="false" placeholder="請貼上 JSON 代碼..."></textarea>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeImport()">取消</button>
                <button class="btn btn-success" onclick="doImport()">📥 導入</button>
            </div>
        </div>
    </div>

    <div class="copy-toast" id="copyToast">✅ 已複製</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>

    <script>
        // ============================================================
        //  1. 參數定義 (預設值，包含部件)
        // ============================================================
        const DEFAULT_PARAMS = {
            "pawn": {
                "baseRadius": 0.12,
                "baseHeight": 0.28,
                "topRadius": 0.185,
                "topHeight": 0.04,
                "sphereRadius": 0.18,
                "color": "#f5f0e1",
                "roughness": 0.25,
                "metalness": 0.2,
                "position": { "x": -4.2, "y": 0, "z": 0 }
            },
            "rook": {
                "bodyRadius": 0.2,
                "bodyHeight": 0.44,
                "crownRadius": 0.285,
                "crownHeight": 0.13,
                "color": "#f5f0e1",
                "roughness": 0.25,
                "metalness": 0.2,
                "position": { "x": -2.52, "y": 0.02, "z": 0 }
            },
            "knight": {
                "bodyRadius": 0.26,
                "bodyHeight": 0.38,
                "neckWidth": 0.22,
                "neckHeight": 0.3,
                "neckDepth": 0.22,
                "headWidth": 0.16,
                "headHeight": 0.22,
                "headDepth": 0.3,
                "color": "#f5f0e1",
                "roughness": 0.25,
                "metalness": 0.2,
                "position": { "x": -0.84, "y": 0.02, "z": 0 },
                "parts": {
                    "body": {
                        "position": { "x": 0, "y": 0.21, "z": 0 },
                        "rotation": { "x": 0, "y": 0, "z": 0 },
                        "scale": { "x": 0.5, "y": 1.02, "z": 0.84 }
                    },
                    "neck": {
                        "position": { "x": 0, "y": 0.54, "z": 0.13 },
                        "rotation": { "x": 0.22, "y": 0, "z": 0 },
                        "scale": { "x": 0.58, "y": 2.44, "z": 1.12 }
                    },
                    "head": {
                        "position": { "x": 0, "y": 0.76, "z": 0.25 },
                        "rotation": { "x": -0.08, "y": 0, "z": 0 },
                        "scale": { "x": 0.98, "y": 1.2, "z": 1.76 }
                    }
                }
            },
            "bishop": {
                "bodyRadius": 0.22,
                "bodyHeight": 0.42,
                "sphereRadius": 0.1,
                "color": "#f5f0e1",
                "roughness": 0.25,
                "metalness": 0.2,
                "position": { "x": 0.84, "y": 0.02, "z": 0 },

        // ============================================================

        function initScene() {
            scene = new THREE.Scene();

            controls.maxDistance = 18;

        // ============================================================
        //  2b. 3D 拖曳控制器 (TransformControls)
        // ============================================================
        function initTransformControls() {
            if (typeof THREE.TransformControls !== 'function') {
                console.warn('TransformControls 未載入，3D 拖曳功能停用');
                return;
            }
            transformControls = new THREE.TransformControls(camera, renderer.domElement);
            transformControls.setSize(0.85);
            transformControls.setSpace('world');
            transformControls.setMode(gizmoMode);

            transformControls.addEventListener('dragging-changed', (e) => {
                controls.enabled = !e.value;
                if (!e.value && selectedPart) {
                    syncPartInputs(selectedPart.type);
                    // ★ 拖曳結束後記錄一次歷史
                    pushHistory();
                }
            });
            transformControls.addEventListener('objectChange', onGizmoChange);

            scene.add(transformControls);
        }

        function onGizmoChange() {
            if (!selectedPart) return;
            const type = selectedPart.type;
            const mesh = getPartMesh(type, selectedPart.partId);
            if (!mesh) return;
            writePartTransform(type, selectedPart.partId, mesh);
            syncPartInputs(type);
        }

        function attachGizmo() {
            if (!transformControls) return;
            if (!selectedPart) {
                transformControls.detach();
                return;
            }
            const mesh = getPartMesh(selectedPart.type, selectedPart.partId);
            if (mesh) transformControls.attach(mesh);
            else transformControls.detach();
        }

        function setGizmoMode(mode) {
            gizmoMode = mode;
            if (transformControls) transformControls.setMode(mode);
            document.querySelectorAll('.gizmo-btn[data-mode]').forEach(b => {
                b.classList.toggle('active', b.dataset.mode === mode);
            });
        }

        function toggleGizmoSpace() {
            if (!transformControls) return;
            const next = transformControls.space === 'world' ? 'local' : 'world';
            transformControls.setSpace(next);
            document.querySelectorAll('.gizmo-space-btn').forEach(b => {
                b.textContent = next === 'world' ? '🌐 世界' : '📦 局部';
                b.classList.toggle('active', next === 'local');
            });
            showToast(next === 'world' ? '🌐 世界座標' : '📦 局部座標');
        }

        function onResize() {
            const w = container.clientWidth || 600;
            const h = container.clientHeight || 400;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);

        function createLabels() {
            const labels = [
                { text: '♟ 兵', x: -4.2 },
                { text: '♜ 車', x: -2.52 },

            for (const label of labels) {
                const canvas = document.createElement('canvas');
                canvas.width = 256;
                canvas.height = 64;
                const ctx = canvas.getContext('2d');

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 12;
                ctx.font = 'bold 28px "Segoe UI", "Microsoft JhengHei", sans-serif';
                ctx.fillStyle = '#e8c547';
                ctx.fillText(label.text, canvas.width / 2, canvas.height / 2 + 2);

                ctx.shadowBlur = 0;
                ctx.fillStyle = '#e8c547';
                ctx.fillText(label.text, canvas.width / 2, canvas.height / 2);

                const texture = new THREE.CanvasTexture(canvas);
                texture.needsUpdate = true;

                const mat = new THREE.SpriteMaterial({
                    map: texture,
                    transparent: true,
                    depthTest: false,
                    sizeAttenuation: true
                });
                const sprite = new THREE.Sprite(mat);
                sprite.scale.set(1.6, 0.4, 1);
                sprite.position.set(label.x, -0.2, 0);
                scene.add(sprite);
            }
