<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>♟ 棋子模型編輯器（部件級 + 3D 拖曳 + 撤銷/重做）</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            background: #1a1a2e;
            color: #f0e6d3;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a2e;
        }

        ::-webkit-scrollbar-thumb {
            background: #e8c547;
            border-radius: 4px;
        }

        #topBar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 24px;
            background: rgba(22, 33, 62, 0.92);
            backdrop-filter: blur(6px);
            border-bottom: 2px solid #e8c547;
            z-index: 20;
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 8px;
        }

        #topBar h1 {
            font-size: 1.3rem;
            color: #e8c547;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #topBar h1 small {
            font-size: 0.7rem;
            opacity: 0.6;
            font-weight: 400;
            letter-spacing: 0;
        }

        .top-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            background: #e8c547;
            color: #1a1a2e;
            box-shadow: 0 2px 10px rgba(232, 197, 71, 0.25);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 18px rgba(232, 197, 71, 0.4);
        }

        .btn:disabled {
            opacity: 0.32;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-secondary {
            background: #3a3a5c;
            color: #f0e6d3;
            box-shadow: none;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #4a4a6c;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.3);
        }

        .btn-danger {
            background: #e74c3c;
            color: #fff;
            box-shadow: 0 2px 10px rgba(231, 76, 60, 0.25);
        }

        .btn-danger:hover:not(:disabled) {
            background: #ff6b5e;
        }

        .btn-success {
            background: #2ecc71;
            color: #1a1a2e;
            box-shadow: 0 2px 10px rgba(46, 204, 113, 0.25);
        }

        .btn-success:hover:not(:disabled) {
            background: #55ef9a;
        }

        .btn-warning {
            background: #f39c12;
            color: #1a1a2e;
            box-shadow: 0 2px 10px rgba(243, 156, 18, 0.25);
        }

        .btn-warning:hover:not(:disabled) {
            background: #f1c40f;
        }

        .btn-sm {
            padding: 4px 12px;
            font-size: 0.7rem;
        }

        #main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        #sceneContainer {
            flex: 1;
            position: relative;
            background: #12121f;
            overflow: hidden;
            min-width: 0;
        }

        #sceneContainer canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        #sceneHint {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: #aaa;
            pointer-events: none;
            white-space: nowrap;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        #panel {
            width: 430px;
            min-width: 340px;
            max-width: 520px;
            background: rgba(22, 33, 62, 0.95);
            backdrop-filter: blur(6px);
            border-left: 2px solid #e8c547;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
        }

        #panelHeader {
            padding: 14px 20px 10px;
            border-bottom: 1px solid rgba(232, 197, 71, 0.2);
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #panelHeader h2 {
            font-size: 1rem;
            color: #e8c547;
            letter-spacing: 1px;
        }

        #panelHeader .badge {
            font-size: 0.65rem;
            background: rgba(232, 197, 71, 0.15);
            padding: 2px 12px;
            border-radius: 12px;
            color: #e8c547;
        }

        #panelBody {
            flex: 1;
            overflow-y: auto;
            padding: 8px 16px 24px;
        }

        .accordion-item {
            margin: 6px 0;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            overflow: hidden;
            transition: border-color 0.2s;
        }

        .accordion-item.active {
            border-color: rgba(232, 197, 71, 0.5);
            box-shadow: 0 0 20px rgba(232, 197, 71, 0.05);
        }

        .accordion-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            cursor: pointer;
            user-select: none;
            transition: background 0.15s;
            gap: 12px;
        }

        .accordion-header:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .accordion-header .piece-icon {
            font-size: 1.4rem;
            width: 32px;
            text-align: center;
        }

        .accordion-header .piece-name {
            font-weight: 700;
            font-size: 0.95rem;
            flex: 1;
        }

        .accordion-header .piece-color-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
        }

        .accordion-header .arrow {
            transition: transform 0.25s;
            font-size: 0.7rem;
            opacity: 0.5;
        }

        .accordion-item.active .accordion-header .arrow {
            transform: rotate(180deg);
        }

        .accordion-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease;
            padding: 0 16px;
        }

        .accordion-item.active .accordion-body {
            max-height: 2400px;
            padding: 0 16px 16px;
            overflow-y: auto;
        }

        .param-group {
            margin: 6px 0 2px;
            min-width: 0;
        }

        .param-group .param-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 4px;
            font-size: 0.72rem;
            opacity: 0.75;
            margin-bottom: 2px;
            white-space: nowrap;
        }

        .param-group .param-label>span:first-child {
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .param-group input[type="range"] {
            width: 100%;
            height: 3px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            outline: none;
        }

        .param-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #e8c547;
            cursor: pointer;
            border: 2px solid #1a1a2e;
        }

        .param-group input[type="range"]::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #e8c547;
            cursor: pointer;
            border: 2px solid #1a1a2e;
        }

        .param-group input[type="color"] {
            width: 100%;
            height: 30px;
            border: none;
            border-radius: 6px;
            background: transparent;
            cursor: pointer;
            padding: 0;
        }

        .param-group input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 2px;
        }

        .param-group input[type="color"]::-webkit-color-swatch {
            border-radius: 6px;
            border: 2px solid rgba(255, 255, 255, 0.15);
        }

        .num-input {
            width: 54px;
            flex-shrink: 0;
            background: #0f0f1a;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 4px;
            color: #e8c547;
            font-family: inherit;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 1px 4px;
            text-align: right;
            outline: none;
            -moz-appearance: textfield;
            appearance: textfield;
        }

        .num-input::-webkit-outer-spin-button,
        .num-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .num-input:focus {
            border-color: #e8c547;
            background: #16162a;
            box-shadow: 0 0 0 2px rgba(232, 197, 71, 0.15);
        }

        .param-row,
        .pos-row {
            display: flex;
            gap: 8px;
        }

        .param-row .param-group,
        .pos-row .param-group {
            flex: 1;
            min-width: 0;
        }

        .pos-title {
            font-size: 0.7rem;
            opacity: 0.5;
            margin: 10px 0 2px;
            letter-spacing: 1px;
        }

        .gizmo-modes {
            display: flex;
            gap: 4px;
            margin-bottom: 8px;
        }

        .gizmo-btn {
            flex: 1;
            padding: 5px 2px;
            font-size: 0.66rem;
            font-family: inherit;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.06);
            color: #cfc7b5;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }

        .gizmo-btn:hover {
            background: rgba(255, 255, 255, 0.13);
        }

        .gizmo-btn.active {
            background: rgba(232, 197, 71, 0.2);
            border-color: #e8c547;
            color: #e8c547;
            box-shadow: 0 0 10px rgba(232, 197, 71, 0.2);
        }

        /* ★ 固定軸向的按鈕（不可點） */
        .gizmo-btn:disabled,
        .gizmo-btn:disabled:hover {
            background: rgba(232, 197, 71, 0.2);
            border-color: #e8c547;
            color: #e8c547;
            box-shadow: 0 0 10px rgba(232, 197, 71, 0.2);
            cursor: default;
        }

        .parts-list {
            margin: 8px 0 4px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .parts-list .part-tag {
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
        }

        .parts-list .part-tag:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .parts-list .part-tag.active {
            border-color: #e8c547;
            background: rgba(232, 197, 71, 0.15);
            color: #e8c547;
        }

        .parts-list .part-tag.air-tag {
            background: rgba(255, 60, 60, 0.12);
            border-color: rgba(255, 80, 80, 0.35);
        }

        .parts-list .part-tag.air-tag.active {
            background: rgba(255, 60, 60, 0.28);
            border-color: #ff5555;
            color: #ff8888;
        }

        .parts-list .part-tag .del-part {
            margin-left: 6px;
            color: #e74c3c;
            cursor: pointer;
            opacity: 0.6;
        }

        .parts-list .part-tag .del-part:hover {
            opacity: 1;
        }

        .parts-list .part-tag .clone-part {
            margin-left: 6px;
            color: #e8c547;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.15s;
        }

        .parts-list .part-tag .clone-part:hover {
            opacity: 1;
        }

        .parts-list .part-tag .rename-part {
            margin-left: 6px;
            color: #4fc3f7;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.15s;
        }

        .parts-list .part-tag .rename-part:hover {
            opacity: 1;
        }

        .add-part-row {
            display: flex;
            gap: 6px;
            margin-top: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .add-part-row select {
            flex: 1;
            min-width: 80px;
            background: #0f0f1a;
            color: #f0e6d3;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 0.75rem;
            outline: none;
            cursor: pointer;
        }

        .add-part-row select:focus {
            border-color: #e8c547;
        }

        .add-part-row .btn {
            padding: 4px 12px;
            font-size: 0.7rem;
        }

        @media (max-width: 820px) {
            #panel {
                width: 320px;
                min-width: 200px;
            }

            #topBar h1 {
                font-size: 1rem;
            }

            .btn {
                padding: 6px 12px;
                font-size: 0.75rem;
            }

            .accordion-header .piece-icon {
                font-size: 1.1rem;
                width: 24px;
            }

            .accordion-header .piece-name {
                font-size: 0.8rem;
            }

            .num-input {
                width: 48px;
                font-size: 0.65rem;
            }
        }

        @media (max-width: 640px) {
            #main {
                flex-direction: column;
            }

            #panel {
                width: 100%;
                max-width: 100%;
                border-left: none;
                border-top: 2px solid #e8c547;
                height: 50vh;
                min-height: 300px;
            }

            #sceneContainer {
                height: 50vh;
                min-height: 200px;
            }

            #sceneHint {
                bottom: 8px;
                font-size: 0.6rem;
                padding: 4px 12px;
                white-space: normal;
            }
        }

        @media (max-width: 480px) {
            #topBar {
                padding: 6px 12px;
            }

            #topBar h1 {
                font-size: 0.85rem;
            }

            .btn {
                padding: 4px 10px;
                font-size: 0.7rem;
            }

            #panelBody {
                padding: 4px 8px 12px;
            }

            .accordion-body {
                padding: 0 8px;
            }

            .accordion-item.active .accordion-body {
                padding: 0 8px 16px;
            }

            .param-group .param-label {
                font-size: 0.63rem;
            }

            .num-input {
                width: 42px;
                font-size: 0.6rem;
            }

            .parts-list .part-tag {
                font-size: 0.6rem;
                padding: 1px 8px;
            }
        }

        .modal-box {
            background: #1a1a2e;
            border: 2px solid #e8c547;
            border-radius: 16px;
            padding: 28px 32px;
            max-width: 720px;
            width: 92%;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        .modal-box h2 {
            color: #e8c547;
            margin-bottom: 12px;
            font-size: 1.2rem;
        }

        .modal-box textarea {
            flex: 1;
            min-height: 280px;
            background: #0f0f1a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #d4d4d4;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            padding: 14px;
            resize: vertical;
            outline: none;
            tab-size: 2;
            line-height: 1.5;
        }

        .modal-box textarea:focus {
            border-color: #e8c547;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 14px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .modal-actions .btn {
            padding: 10px 24px;
        }

        #exportModal,
        #importModal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 999;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
        }

        #exportModal.open,
        #importModal.open {
            display: flex;
        }

        .copy-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2ecc71;
            color: #1a1a2e;
            padding: 10px 28px;
            border-radius: 12px;
            font-weight: 700;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            box-shadow: 0 8px 30px rgba(46, 204, 113, 0.3);
        }

        .copy-toast.show {
            opacity: 1;
        }
    </style>
</head>

<body>

    <div id="topBar">
        <h1>
            ♟ 棋子編輯器 <small>部件級拖曳・可輸入數值・撤銷/重做</small>
        </h1>
        <div class="top-actions">
            <button class="btn btn-secondary" id="undoBtn" onclick="undo()" title="撤銷 (Ctrl+Z)" disabled>↶ 撤銷</button>
            <button class="btn btn-secondary" id="redoBtn" onclick="redo()" title="重做 (Ctrl+Shift+Z)" disabled>↷
                重做</button>
            <button class="btn btn-secondary" onclick="resetAll()">↺ 重置</button>
            <button class="btn btn-warning" onclick="openImportModal()">📥 匯入</button>
            <button class="btn btn-success" onclick="exportCode()">📤 匯出</button>
        </div>
    </div>

    <div id="main">
        <div id="sceneContainer">
            <div id="sceneHint">🖱 左鍵旋轉 · 滾輪縮放 · 右鍵平移 · 拖曳箭頭移動部件（世界軸） · G/R/S 模式 · Ctrl+Z 撤銷</div>
        </div>
        <div id="panel">
            <div id="panelHeader">
                <h2>⚙ 參數調整</h2>
                <span class="badge">即時預覽</span>
            </div>
            <div id="panelBody"></div>
        </div>
    </div>

    <div id="exportModal">
        <div class="modal-box">
            <h2>📤 匯出棋子模型代碼</h2>
            <p style="opacity:0.6;font-size:0.85rem;margin-bottom:12px;">
                複製下方代碼，替換原 <code style="background:#2a2a4a;padding:2px 8px;border-radius:4px;">PIECE_PARAMS</code>
            </p>
            <textarea id="exportCodeArea" spellcheck="false"></textarea>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeExport()">關閉</button>
                <button class="btn btn-success" onclick="copyExport()">📋 複製</button>
            </div>
        </div>
    </div>

    <div id="importModal">
        <div class="modal-box">
            <h2>📥 匯入棋子參數</h2>
            <p style="opacity:0.6;font-size:0.85rem;margin-bottom:12px;">
                貼上從編輯器匯出的 JSON 代碼（可包含 <code
                    style="background:#2a2a4a;padding:2px 8px;border-radius:4px;">const PIECE_PARAMS = </code> 前綴）
            </p>
            <textarea id="importCodeArea" spellcheck="false" placeholder="請貼上 JSON 代碼..."></textarea>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeImport()">取消</button>
                <button class="btn btn-success" onclick="doImport()">📥 導入</button>
            </div>
        </div>
    </div>

    <div class="copy-toast" id="copyToast">✅ 已複製</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>

    <!-- ============================================================ -->
    <!--  CSG LIBRARY (for air blocks)                                 -->
    <!-- ============================================================ -->
    <script>
        (function (global) {
            const EPSILON = 1e-5;
            const COPLANAR = 0, FRONT = 1, BACK = 2, SPANNING = 3;

            class Vector {
                constructor(x, y, z) { this.x = x; this.y = y; this.z = z; }
                clone() { return new Vector(this.x, this.y, this.z); }
                negated() { return new Vector(-this.x, -this.y, -this.z); }
                plus(a) { return new Vector(this.x + a.x, this.y + a.y, this.z + a.z); }
                minus(a) { return new Vector(this.x - a.x, this.y - a.y, this.z - a.z); }
                times(a) { return new Vector(this.x * a, this.y * a, this.z * a); }
                dividedBy(a) { return new Vector(this.x / a, this.y / a, this.z / a); }
                dot(a) { return this.x * a.x + this.y * a.y + this.z * a.z; }
                lerp(a, t) { return this.plus(a.minus(this).times(t)); }
                length() { return Math.sqrt(this.dot(this)); }
                unit() { return this.dividedBy(this.length()); }
                cross(a) {
                    return new Vector(
                        this.y * a.z - this.z * a.y,
                        this.z * a.x - this.x * a.z,
                        this.x * a.y - this.y * a.x
                    );
                }
            }

            class Vertex {
                constructor(pos, normal) { this.pos = pos; this.normal = normal; }
                clone() { return new Vertex(this.pos.clone(), this.normal.clone()); }
                flip() { this.normal = this.normal.negated(); }
                interpolate(other, t) {
                    return new Vertex(
                        this.pos.lerp(other.pos, t),
                        this.normal.lerp(other.normal, t)
                    );
                }
            }

            class Plane {
                constructor(normal, w) { this.normal = normal; this.w = w; }
                static fromPoints(a, b, c) {
                    const n = b.minus(a).cross(c.minus(a)).unit();
                    return new Plane(n, n.dot(a));
                }
                clone() { return new Plane(this.normal.clone(), this.w); }
                flip() { this.normal = this.normal.negated(); this.w = -this.w; }
                splitPolygon(polygon, coplanarFront, coplanarBack, front, back) {
                    let polygonType = 0;
                    const types = [];
                    for (const v of polygon.vertices) {
                        const t = this.normal.dot(v.pos) - this.w;
                        const type = t < -EPSILON ? BACK : (t > EPSILON ? FRONT : COPLANAR);
                        polygonType |= type;
                        types.push(type);
                    }
                    switch (polygonType) {
                        case COPLANAR:
                            (this.normal.dot(polygon.plane.normal) > 0 ? coplanarFront : coplanarBack).push(polygon);
                            break;
                        case FRONT: front.push(polygon); break;
                        case BACK: back.push(polygon); break;
                        case SPANNING: {
                            const f = [], b = [];
                            for (let i = 0; i < polygon.vertices.length; i++) {
                                const j = (i + 1) % polygon.vertices.length;
                                const ti = types[i], tj = types[j];
                                const vi = polygon.vertices[i], vj = polygon.vertices[j];
                                if (ti !== BACK) f.push(vi);
                                if (ti !== FRONT) b.push(ti !== BACK ? vi.clone() : vi);
                                if ((ti | tj) === SPANNING) {
                                    const t = (this.w - this.normal.dot(vi.pos)) /
                                        this.normal.dot(vj.pos.minus(vi.pos));
                                    const v = vi.interpolate(vj, t);
                                    f.push(v);
                                    b.push(v.clone());
                                }
                            }
                            if (f.length >= 3) front.push(new Polygon(f, polygon.shared));
                            if (b.length >= 3) back.push(new Polygon(b, polygon.shared));
                            break;
                        }
                    }
                }
            }

            class Polygon {
                constructor(vertices, shared) {
                    this.vertices = vertices;
                    this.shared = shared;
                    this._plane = null;
                }
                clone() { return new Polygon(this.vertices.map(v => v.clone()), this.shared); }
                flip() {
                    this.vertices.reverse().forEach(v => v.flip());
                    if (this._plane) this._plane.flip();
                }
                get plane() {
                    if (!this._plane) {
                        this._plane = Plane.fromPoints(
                            this.vertices[0].pos,
                            this.vertices[1].pos,
                            this.vertices[2].pos
                        );
                    }
                    return this._plane;
                }
            }

            class Node {
                constructor(polygons) {
                    this.plane = null;
                    this.front = null;
                    this.back = null;
                    this.polygons = [];
                    if (polygons) this.build(polygons);
                }
                clone() {
                    const n = new Node();
                    n.plane = this.plane && this.plane.clone();
                    n.front = this.front && this.front.clone();
                    n.back = this.back && this.back.clone();
                    n.polygons = this.polygons.map(p => p.clone());
                    return n;
                }
                invert() {
                    for (const p of this.polygons) p.flip();
                    if (this.plane) this.plane.flip();
                    if (this.front) this.front.invert();
                    if (this.back) this.back.invert();
                    const temp = this.front; this.front = this.back; this.back = temp;
                }
                clipPolygons(polygons) {
                    if (!this.plane) return polygons.slice();
                    let front = [], back = [];
                    for (const p of polygons) this.plane.splitPolygon(p, front, back, front, back);
                    if (this.front) front = this.front.clipPolygons(front);
                    back = this.back ? this.back.clipPolygons(back) : [];
                    return front.concat(back);
                }
                clipTo(bsp) {
                    this.polygons = bsp.clipPolygons(this.polygons);
                    if (this.front) this.front.clipTo(bsp);
                    if (this.back) this.back.clipTo(bsp);
                }
                allPolygons() {
                    let polygons = this.polygons.slice();
                    if (this.front) polygons = polygons.concat(this.front.allPolygons());
                    if (this.back) polygons = polygons.concat(this.back.allPolygons());
                    return polygons;
                }
                build(polygons) {
                    if (!polygons.length) return;
                    if (!this.plane) this.plane = polygons[0].plane.clone();
                    const front = [], back = [];
                    for (const p of polygons) {
                        this.plane.splitPolygon(p, this.polygons, this.polygons, front, back);
                    }
                    if (front.length) {
                        if (!this.front) this.front = new Node();
                        this.front.build(front);
                    }
                    if (back.length) {
                        if (!this.back) this.back = new Node();
                        this.back.build(back);
                    }
                }
            }

            function subtract(polysA, polysB) {
                const A = new Node(polysA.map(p => p.clone()));
                const B = new Node(polysB.map(p => p.clone()));
                A.invert();
                A.clipTo(B);
                B.clipTo(A);
                B.invert();
                B.clipTo(A);
                B.invert();
                A.build(B.allPolygons());
                A.invert();
                return A.allPolygons();
            }

            global.CSG = { Vector, Vertex, Plane, Polygon, Node, subtract };
        })(window);

        // ── Three.js interop helpers ────────────────────────────────

        function meshToCSGPolygons(mesh) {
            mesh.updateMatrixWorld(true);
            const geo = mesh.geometry.index ? mesh.geometry.toNonIndexed() : mesh.geometry;
            const posAttr = geo.attributes.position;
            const normAttr = geo.attributes.normal;
            const matrix = mesh.matrixWorld;
            const nrmMatrix = new THREE.Matrix3().getNormalMatrix(matrix);

            const polys = [];
            for (let i = 0; i < posAttr.count; i += 3) {
                const v = [0, 1, 2].map(k => new THREE.Vector3()
                    .fromBufferAttribute(posAttr, i + k)
                    .applyMatrix4(matrix));

                const faceN = new THREE.Vector3()
                    .subVectors(v[1], v[0])
                    .cross(new THREE.Vector3().subVectors(v[2], v[0]))
                    .normalize();

                const verts = [0, 1, 2].map(k => {
                    let n = faceN;
                    if (normAttr) {
                        n = new THREE.Vector3()
                            .fromBufferAttribute(normAttr, i + k)
                            .applyMatrix3(nrmMatrix)
                            .normalize();
                    }
                    return new CSG.Vertex(
                        new CSG.Vector(v[k].x, v[k].y, v[k].z),
                        new CSG.Vector(n.x, n.y, n.z)
                    );
                });
                polys.push(new CSG.Polygon(verts, mesh));
            }
            return polys;
        }

        function csgPolygonsToGeometry(polys, mesh) {
            mesh.updateMatrixWorld(true);
            const invMatrix = new THREE.Matrix4().copy(mesh.matrixWorld).invert();
            const nrmMatrix = new THREE.Matrix3().getNormalMatrix(invMatrix);

            const positions = [];
            const normals = [];

            for (const poly of polys) {
                const vs = poly.vertices;
                for (let i = 2; i < vs.length; i++) {
                    const tri = [vs[0], vs[i - 1], vs[i]];
                    for (const v of tri) {
                        const p = new THREE.Vector3(v.pos.x, v.pos.y, v.pos.z)
                            .applyMatrix4(invMatrix);
                        const n = new THREE.Vector3(v.normal.x, v.normal.y, v.normal.z)
                            .applyMatrix3(nrmMatrix).normalize();
                        positions.push(p.x, p.y, p.z);
                        normals.push(n.x, n.y, n.z);
                    }
                }
            }

            const g = new THREE.BufferGeometry();
            g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            g.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
            g.computeBoundingBox();
            g.computeBoundingSphere();
            return g;
        }

        // ★ 幾何體是否為可做 CSG 的封閉實體
        function isSolidGeometry(geo) {
            if (!geo) return false;
            const t = geo.type;
            // 開放曲面沒有體積，改走「多邊形裁切」路徑
            if (t === 'RingGeometry' || t === 'PlaneGeometry' || t === 'CircleGeometry') return false;
            return true;
        }

        function makeEmptyGeometry() {
            const g = new THREE.BufferGeometry();
            g.setAttribute('position', new THREE.Float32BufferAttribute([], 3));
            g.setAttribute('normal', new THREE.Float32BufferAttribute([], 3));
            g.computeBoundingBox();
            g.computeBoundingSphere();
            return g;
        }

        // ── 取得網格在世界座標中的 6 個外側平面（凸體裁切用）────────
        function getWorldBoxPlanes(mesh) {
            mesh.updateMatrixWorld(true);
            const geo = mesh.geometry;
            if (!geo.boundingBox) geo.computeBoundingBox();
            const bb = geo.boundingBox;
            if (!bb || bb.isEmpty()) return [];

            const m = mesh.matrixWorld;
            const nrmM = new THREE.Matrix3().getNormalMatrix(m);
            const planes = [];
            const axes = [
                [new THREE.Vector3(1, 0, 0), bb.min.x, bb.max.x],
                [new THREE.Vector3(0, 1, 0), bb.min.y, bb.max.y],
                [new THREE.Vector3(0, 0, 1), bb.min.z, bb.max.z],
            ];
            for (const [axis, minV, maxV] of axes) {
                for (const [val, sign] of [[maxV, 1], [minV, -1]]) {
                    const centerWorld = axis.clone().multiplyScalar(val).applyMatrix4(m);
                    const normal = axis.clone().multiplyScalar(sign).applyMatrix3(nrmM).normalize();
                    planes.push({ normal, constant: -normal.dot(centerWorld) });
                }
            }
            return planes;
        }

        // ── 保留多邊形「在盒子外」的片段，回傳多個多邊形 ─────────────
        //    盒子是凸體：只要多邊形整片落在任一個外側面之外，就必定在盒外。
        function clipPolyOutsideBox(poly, planes, planeIdx, out) {
            if (!out) out = [];
            if (poly.length < 3) return out;
            if (planeIdx >= planes.length) return out;   // 全部落在盒內 → 丟棄

            const plane = planes[planeIdx];
            const d = poly.map(v => plane.normal.dot(v.pos) + plane.constant);

            let hasFront = false, hasBack = false;
            for (const x of d) {
                if (x > 1e-7) hasFront = true;
                else if (x < -1e-7) hasBack = true;
            }
            // 整片都在這個面的內側 → 還得看其他面
            if (!hasFront) return clipPolyOutsideBox(poly, planes, planeIdx + 1, out);
            // 整片都在這個面的外側 → 確定在盒外，整片保留
            if (!hasBack) { out.push(poly); return out; }

            const front = [], back = [];
            for (let i = 0; i < poly.length; i++) {
                const j = (i + 1) % poly.length;
                const di = d[i], dj = d[j];
                if (di >= 0) front.push(poly[i]);
                if (di <= 0) back.push(poly[i]);
                if ((di > 0 && dj < 0) || (di < 0 && dj > 0)) {
                    const t = di / (di - dj);
                    const pos = poly[i].pos.clone().lerp(poly[j].pos, t);
                    const nrm = poly[i].nrm.clone().lerp(poly[j].nrm, t).normalize();
                    front.push({ pos, nrm });
                    back.push({ pos: pos.clone(), nrm: nrm.clone() });
                }
            }
            if (front.length >= 3) out.push(front);
            if (back.length >= 3) clipPolyOutsideBox(back, planes, planeIdx + 1, out);
            return out;
        }

        // ── 用空氣塊裁切「開放曲面」網格（平面 / 圓環 / 圓盤）────────
        function clipMeshByAirBoxes(mesh, boxesPlanes) {
            mesh.updateMatrixWorld(true);
            const src = mesh.geometry.index ? mesh.geometry.toNonIndexed() : mesh.geometry;
            const posAttr = src.attributes.position;
            const nrmAttr = src.attributes.normal;

            const matrix = mesh.matrixWorld;
            const invMatrix = new THREE.Matrix4().copy(matrix).invert();
            const nrmMatrix = new THREE.Matrix3().getNormalMatrix(matrix);
            const invNrmMatrix = new THREE.Matrix3().getNormalMatrix(invMatrix);

            const outPos = [], outNrm = [];
            const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();

            for (let i = 0; i < posAttr.count; i += 3) {
                a.fromBufferAttribute(posAttr, i).applyMatrix4(matrix);
                b.fromBufferAttribute(posAttr, i + 1).applyMatrix4(matrix);
                c.fromBufferAttribute(posAttr, i + 2).applyMatrix4(matrix);

                const faceN = new THREE.Vector3()
                    .subVectors(b, a)
                    .cross(new THREE.Vector3().subVectors(c, a))
                    .normalize();

                const ns = [0, 1, 2].map(k => {
                    if (!nrmAttr) return faceN.clone();
                    return new THREE.Vector3()
                        .fromBufferAttribute(nrmAttr, i + k)
                        .applyMatrix3(nrmMatrix)
                        .normalize();
                });

                let polys = [[
                    { pos: a.clone(), nrm: ns[0] },
                    { pos: b.clone(), nrm: ns[1] },
                    { pos: c.clone(), nrm: ns[2] },
                ]];

                // 依序挖掉每一個重疊空氣塊
                for (const planes of boxesPlanes) {
                    const next = [];
                    for (const p of polys) clipPolyOutsideBox(p, planes, 0, next);
                    polys = next;
                    if (polys.length === 0) break;
                }

                for (const poly of polys) {
                    for (let k = 2; k < poly.length; k++) {
                        const tri = [poly[0], poly[k - 1], poly[k]];
                        for (const v of tri) {
                            const p = v.pos.clone().applyMatrix4(invMatrix);
                            const n = v.nrm.clone().applyMatrix3(invNrmMatrix).normalize();
                            outPos.push(p.x, p.y, p.z);
                            outNrm.push(n.x, n.y, n.z);
                        }
                    }
                }
            }

            const g = new THREE.BufferGeometry();
            g.setAttribute('position', new THREE.Float32BufferAttribute(outPos, 3));
            g.setAttribute('normal', new THREE.Float32BufferAttribute(outNrm, 3));
            g.computeBoundingBox();
            g.computeBoundingSphere();
            return g;
        }

        // ── 主流程：把所有與空氣塊重疊的部件全部挖掉 ──────────────────
        function applyAirBlockCSG(group) {
            const airMeshes = [];
            const partMeshes = [];
            for (const mesh of Object.values(group.userData.parts)) {
                if (mesh.userData.isAir) airMeshes.push(mesh);
                else partMeshes.push(mesh);
            }
            if (airMeshes.length === 0 || partMeshes.length === 0) return;

            group.updateMatrixWorld(true);

            // 預先算好每個空氣塊的世界座標資料
            const airData = airMeshes.map(air => {
                // 加一個極小偏移，避免 CSG 共面誤差
                const origPos = air.position.clone();
                air.position.add(new THREE.Vector3(0.0001, 0.00013, 0.00011));
                air.updateMatrixWorld(true);

                const bbox = new THREE.Box3().setFromObject(air);
                bbox.expandByScalar(0.03);   // 放寬一點，避免邊緣漏判

                const polys = meshToCSGPolygons(air);
                const planes = getWorldBoxPlanes(air);

                air.position.copy(origPos);
                air.updateMatrixWorld(true);

                return { polys, bbox, planes };
            });

            for (const part of partMeshes) {
                const partBox = new THREE.Box3().setFromObject(part);
                partBox.expandByScalar(0.03);

                // 收集所有 AABB 可能重疊的空氣塊
                const overlapping = airData.filter(a => partBox.intersectsBox(a.bbox));
                if (overlapping.length === 0) continue;

                if (isSolidGeometry(part.geometry)) {
                    // ── 封閉實體：CSG 布林減集，切口有完整斷面 ──
                    let polys = meshToCSGPolygons(part);
                    for (const air of overlapping) {
                        try {
                            polys = CSG.subtract(polys, air.polys);
                        } catch (e) {
                            console.warn('CSG subtract failed on part', part.userData.partKey, e);
                        }
                    }
                    const newGeo = (polys && polys.length > 0)
                        ? csgPolygonsToGeometry(polys, part)
                        : makeEmptyGeometry();

                    if (part.geometry.dispose) part.geometry.dispose();
                    part.geometry = newGeo;
                } else {
                    // ── 開放曲面（平面 / 圓環 / 圓盤）：多邊形裁切直接挖洞 ──
                    const newGeo = clipMeshByAirBoxes(part, overlapping.map(a => a.planes));
                    if (part.geometry.dispose) part.geometry.dispose();
                    part.geometry = newGeo;
                }
            }
        }

        // Check if a given piece group contains any air block
        function pieceHasAir(group) {
            if (!group || !group.userData.parts) return false;
            return Object.values(group.userData.parts).some(m => m.userData.isAir);
        }
    </script>

        function initScene() {

                color: 0xe8c547, transparent: true, opacity: 0.08, side: THREE.DoubleSide
            });
            const disc = new THREE.Mesh(discGeo, discMat);
            disc.rotation.x = -Math.PI / 2;
            disc.position.y = -0.04;

            createLabels();
            window.addEventListener('resize', onResize);

        function initTransformControls() {
            if (typeof THREE.TransformControls !== 'function') {
                console.warn('TransformControls 未載入，3D 拖曳功能停用');
                return;
            }
            transformControls = new THREE.TransformControls(camera, renderer.domElement);
            transformControls.setSize(0.85);
            transformControls.setSpace('world');   // ★ 一律世界座標
            transformControls.setMode(gizmoMode);

            // ★★ 讓 Gizmo 的三軸永遠對齊世界 X / Y / Z，不隨部件自身旋轉而傾斜
            lockGizmoToWorldAxes(transformControls);

            // ★ Gizmo drag end → trigger CSG rebuild if the piece has any air block
            transformControls.addEventListener('dragging-changed', (e) => {
                controls.enabled = !e.value;
                if (!e.value && selectedPart) {
                    syncPartInputs(selectedPart.type);
                    pushHistory();
                    // ★ 若該棋子含有 air 塊，滑鼠一放開就重算 CSG
                    const group = pieceGroups[selectedPart.type];
                    if (pieceHasAir(group)) {
                        scheduleCSGRebuild();
                    }
                }
            });
            transformControls.addEventListener('objectChange', onGizmoChange);

            scene.add(transformControls);
        }

        // ★ 強制 Gizmo 的箭頭／圓環永遠指向世界座標軸。
        //   TransformControls 在 "local" 模式（或某些版本於縮放模式）會把
        //   自身 quaternion 設成部件的世界旋轉，導致箭頭跟著部件傾斜。
        //   這裡在每次 updateMatrixWorld 之後把它歸零，並重建矩陣。
        //   縮放模式例外：世界軸縮放會造成 shear，Three.js 一律採局部軸。
        function lockGizmoToWorldAxes(tc) {
            const origUpdateMatrixWorld = tc.updateMatrixWorld.bind(tc);

            tc.updateMatrixWorld = function (force) {
                origUpdateMatrixWorld(force);

                if (this.mode === 'scale') return;   // 縮放維持局部軸（避免剪切）
                if (this.quaternion.w === 1 &&
                    this.quaternion.x === 0 &&
                    this.quaternion.y === 0 &&
                    this.quaternion.z === 0) return; // 已經是世界軸，不做事

                this.quaternion.set(0, 0, 0, 1);
                this.updateMatrix();

                if (this.parent) {
                    this.matrixWorld.multiplyMatrices(this.parent.matrixWorld, this.matrix);
                } else {
                    this.matrixWorld.copy(this.matrix);
                }

                for (let i = 0; i < this.children.length; i++) {
                    this.children[i].updateMatrixWorld(true);
                }
            };
        }

        function onGizmoChange() {
            if (!selectedPart) return;
            const type = selectedPart.type;
            const mesh = getPartMesh(type, selectedPart.partId);
            if (!mesh) return;
            writePartTransform(type, selectedPart.partId, mesh);
            syncPartInputs(type);
            if (mesh.userData.isAir) syncAirOutline(mesh);
            if (highlightBoxHelper && highlightMeshRef === mesh) highlightBoxHelper.update();
        }

        function attachGizmo() {
            if (!transformControls) return;
            if (!selectedPart) {
                transformControls.detach();
                return;
            }
            const mesh = getPartMesh(selectedPart.type, selectedPart.partId);
            if (mesh) transformControls.attach(mesh);
            else transformControls.detach();
        }

        function setGizmoMode(mode) {
            gizmoMode = mode;
            if (transformControls) transformControls.setMode(mode);
            document.querySelectorAll('.gizmo-btn[data-mode]').forEach(b => {
                b.classList.toggle('active', b.dataset.mode === mode);
            });
        }

        function onResize() {
            const w = container.clientWidth || 600;
            const h = container.clientHeight || 400;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            if (highlightBoxHelper && highlightMeshRef) {
                const t = performance.now() * 0.005;
                const pulse = 0.55 + 0.45 * Math.sin(t);

                if (highlightMeshRef.material && highlightMeshRef.material.emissive) {
                    if (!highlightMeshRef.userData.isAir) {
                        highlightMeshRef.material.emissiveIntensity = 0.35 + 1.1 * pulse;
                    }
                }
                if (highlightBoxHelper.material) {
                    highlightBoxHelper.material.opacity = 0.5 + 0.5 * pulse;
                }
                highlightBoxHelper.update();
            }

            renderer.render(scene, camera);
        }

        function createLabels() {
            const labels = [
                { text: '♟ 兵', x: -4.2 },
                { text: '♜ 車', x: -2.52 },
                { text: '♞ 馬', x: -0.84 },
                { text: '♝ 象', x: 0.84 },
                { text: '♛ 后', x: 2.52 },
                { text: '♚ 王', x: 4.2 }
            ];

            for (const label of labels) {
                const canvas = document.createElement('canvas');
                canvas.width = 256;
                canvas.height = 64;
                const ctx = canvas.getContext('2d');

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 12;
                ctx.font = 'bold 28px "Segoe UI", "Microsoft JhengHei", sans-serif';
                ctx.fillStyle = '#e8c547';
                ctx.fillText(label.text, canvas.width / 2, canvas.height / 2 + 2);

                ctx.shadowBlur = 0;
                ctx.fillStyle = '#e8c547';
                ctx.fillText(label.text, canvas.width / 2, canvas.height / 2);

                const texture = new THREE.CanvasTexture(canvas);
                texture.needsUpdate = true;

                const mat = new THREE.SpriteMaterial({
                    map: texture, transparent: true, depthTest: false, sizeAttenuation: true
                });
                const sprite = new THREE.Sprite(mat);
                sprite.scale.set(1.6, 0.4, 1);
                sprite.position.set(label.x, -0.2, 0);
                scene.add(sprite);
            }
        }

        // ============================================================
        //  3. 棋子構建
        // ============================================================
        function buildPiece(type, params, customParts) {
            const group = new THREE.Group();
            group.userData.parts = {};

            const color = params.color || '#f5f0e1';
            const roughness = params.roughness ?? 0.25;
            const metalness = params.metalness ?? 0.20;

            const baseMat = new THREE.MeshStandardMaterial({ color, roughness, metalness });
            const accentMat = new THREE.MeshStandardMaterial({
                color, roughness: Math.min(1, roughness + 0.1),
                metalness: Math.max(0, metalness - 0.05)
            });

            const addPart = (geo, mat, x, y, z, rot, partKey, displayName) => {
                const stored = (params.parts && params.parts[partKey]) || null;
                if (stored && stored.deleted) return null;

                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(x, y, z);
                if (rot) mesh.rotation.copy(rot);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                mesh.userData.partKey = partKey;
                mesh.userData.partName = (stored && stored.name) || displayName || partKey;
                mesh.userData.isBuiltin = true;

                if (stored) {
                    if (stored.position) mesh.position.set(stored.position.x || 0, stored.position.y || 0, stored.position.z || 0);
                    if (stored.rotation) mesh.rotation.set(stored.rotation.x || 0, stored.rotation.y || 0, stored.rotation.z || 0);
                    if (stored.scale) mesh.scale.set(stored.scale.x || 1, stored.scale.y || 1, stored.scale.z || 1);
                }
                group.add(mesh);
                group.userData.parts[partKey] = mesh;
                return mesh;
            };

            const baseRadius = (type === 'king' || type === 'queen') ? 0.35 : 0.30;
            addPart(new THREE.CylinderGeometry(baseRadius, baseRadius * 1.15, 0.12, 16), baseMat, 0, 0.06, 0, null, 'base', '基座');

            switch (type) {
                case 'pawn': {
                    const { baseRadius: br, baseHeight: bh, topRadius: tr, topHeight: th, sphereRadius: sr } = params;
                    addPart(new THREE.CylinderGeometry(br, br * 1.2, bh, 12), baseMat, 0, 0.06 + bh / 2, 0, null, 'body', '身體');
                    addPart(new THREE.CylinderGeometry(tr * 1.1, tr, th, 12), accentMat, 0, 0.06 + bh + th / 2, 0, null, 'top', '頂部');
                    addPart(new THREE.SphereGeometry(sr, 12, 12), baseMat, 0, 0.06 + bh + th + sr * 0.7, 0, null, 'sphere', '球頂');
                    break;
                }
                case 'rook': {
                    const { bodyRadius: br, bodyHeight: bh, crownRadius: cr, crownHeight: ch } = params;
                    addPart(new THREE.CylinderGeometry(br, br * 1.15, bh, 16), baseMat, 0, 0.06 + bh / 2, 0, null, 'body', '身體');
                    addPart(new THREE.CylinderGeometry(cr, cr * 1.05, ch, 16), accentMat, 0, 0.06 + bh + ch / 2, 0, null, 'crown', '冠部');
                    break;
                }
                case 'knight': {
                    const { bodyRadius: br, bodyHeight: bh, neckWidth: nw, neckHeight: nh, neckDepth: nd,
                        headWidth: hw, headHeight: hh, headDepth: hd } = params;
                    addPart(new THREE.CylinderGeometry(br, br * 1.15, bh, 16), baseMat, 0, 0.06 + bh / 2, 0, null, 'body', '身體');
                    addPart(new THREE.BoxGeometry(nw, nh, nd), baseMat, 0.05, 0.06 + bh + nh / 2, -0.02, new THREE.Euler(-0.3, 0, 0), 'neck', '頸部');
                    addPart(new THREE.BoxGeometry(hw, hh, hd), accentMat, 0.12, 0.06 + bh + nh + hh / 2 - 0.02, 0.08, new THREE.Euler(-0.15, 0, 0), 'head', '頭部');
                    break;
                }
                case 'bishop': {
                    const { bodyRadius: br, bodyHeight: bh, sphereRadius: sr } = params;
                    addPart(new THREE.ConeGeometry(br, bh, 16), baseMat, 0, 0.06 + bh / 2, 0, null, 'body', '身體');
                    addPart(new THREE.SphereGeometry(sr, 10, 10), accentMat, 0, 0.06 + bh + sr * 0.7, 0, null, 'sphere', '球頂');
                    break;
                }
                case 'queen': {
                    const { bodyRadius: br, bodyHeight: bh, crownRadius: cr, crownHeight: ch, spikeRadius: spr } = params;
                    addPart(new THREE.CylinderGeometry(br, br * 1.12, bh, 16), baseMat, 0, 0.06 + bh / 2, 0, null, 'body', '身體');
                    addPart(new THREE.CylinderGeometry(cr, cr * 1.15, ch, 16), accentMat, 0, 0.06 + bh + ch / 2, 0, null, 'crown', '冠部');
                    addPart(new THREE.SphereGeometry(spr, 8, 8), accentMat, 0, 0.06 + bh + ch + spr * 1.2, 0, null, 'spike', '尖刺');
                    break;
                }
                case 'king': {
                    const { bodyRadius: br, bodyHeight: bh, crownRadius: cr, crownHeight: ch,
                        crossWidth: cw, crossHeight: ch2, crossDepth: cd } = params;
                    addPart(new THREE.CylinderGeometry(br, br * 1.12, bh, 16), baseMat, 0, 0.06 + bh / 2, 0, null, 'body', '身體');
                    addPart(new THREE.CylinderGeometry(cr, cr * 1.05, ch, 16), accentMat, 0, 0.06 + bh + ch / 2, 0, null, 'crown', '冠部');
                    addPart(new THREE.BoxGeometry(cw, ch2, cd), accentMat, 0, 0.06 + bh + ch + ch2 / 2, 0, null, 'crossV', '十字豎');
                    addPart(new THREE.BoxGeometry(ch2 * 0.7, ch2 * 0.3, cd * 0.6), accentMat, 0, 0.06 + bh + ch + ch2 * 0.75, 0, null, 'crossH', '十字橫');
                    break;
                }
            }

            if (customParts) {
                for (const [id, partData] of Object.entries(customParts)) {
                    if (BUILTIN_PART_IDS.includes(id)) continue;
                    if (partData.deleted) continue;

                    const isAir = partData.type === 'air';
                    const geo = createGeometry(partData.type, partData.geometryParams || {});
                    const mat = isAir
                        ? new THREE.MeshBasicMaterial({ color: 0xff3333 })
                        : createCustomPartMaterial(partData, params);

                    const mesh = new THREE.Mesh(geo, mat);
                    mesh.position.set(partData.position?.x || 0, partData.position?.y || 0, partData.position?.z || 0);
                    mesh.rotation.set(partData.rotation?.x || 0, partData.rotation?.y || 0, partData.rotation?.z || 0);
                    mesh.scale.set(partData.scale?.x || 1, partData.scale?.y || 1, partData.scale?.z || 1);

                    mesh.castShadow = !isAir;
                    mesh.receiveShadow = !isAir;

                    mesh.userData.partKey = id;
                    mesh.userData.partName = partData.name || (isAir ? 'Air' : '自定義');
                    mesh.userData.isCustom = true;
                    mesh.userData.isAir = isAir;

                    if (isAir) {
                        // ★ 預設隱藏，僅在選中時才顯示（避免遮擋視線）
                        mesh.visible = false;
                        mesh.material.transparent = true;
                        mesh.material.opacity = 0.16;
                        mesh.material.depthTest = false;
                        mesh.material.depthWrite = false;
                        mesh.material.side = THREE.DoubleSide;
                        mesh.material.color.set(0xff3b5c);
                        mesh.renderOrder = 998;

                        const outline = new THREE.LineSegments(
                            new THREE.EdgesGeometry(geo),
                            new THREE.LineBasicMaterial({
                                color: 0xff3b5c,
                                transparent: true,
                                opacity: 0.9,
                                depthTest: false,
                                depthWrite: false,
                            })
                        );

                        outline.name = '__airOutline_' + id;
                        outline.renderOrder = 999;
                        outline.frustumCulled = false;
                        outline.raycast = () => { };
                        outline.visible = false;   // ★ 預設隱藏
                        outline.position.copy(mesh.position);
                        outline.rotation.copy(mesh.rotation);
                        outline.scale.copy(mesh.scale);
                        group.add(outline);

                        mesh.userData.airOutline = outline;
                    }

                    group.add(mesh);
                    group.userData.parts[id] = mesh;
                }
            }

            if (Object.values(group.userData.parts).some(m => m.userData.isAir)) {
                try {
                    applyAirBlockCSG(group);
                } catch (e) {
                    console.warn('Air block CSG failed:', e);
                }
            }

            return group;
        }

        function createGeometry(type, params) {
            switch (type) {
                case 'box': return new THREE.BoxGeometry(params.width || 0.2, params.height || 0.2, params.depth || 0.2);
                case 'sphere': return new THREE.SphereGeometry(params.radius || 0.15, 16, 16);
                case 'cylinder': return new THREE.CylinderGeometry(params.radiusTop || 0.15, params.radiusBottom || 0.15, params.height || 0.3, 16);
                case 'cone': return new THREE.ConeGeometry(params.radius || 0.15, params.height || 0.3, 16);
                case 'torus': return new THREE.TorusGeometry(params.radius || 0.15, params.tube || 0.05, 12, 16);
                case 'frustum': return new THREE.CylinderGeometry(params.radiusTop ?? 0.08, params.radiusBottom ?? 0.18, params.height || 0.3, params.segments || 16);
                case 'tetrahedron': return new THREE.TetrahedronGeometry(params.radius || 0.2, params.detail || 0);
                case 'octahedron': return new THREE.OctahedronGeometry(params.radius || 0.2, params.detail || 0);
                case 'dodecahedron': return new THREE.DodecahedronGeometry(params.radius || 0.2, params.detail || 0);
                case 'icosahedron': return new THREE.IcosahedronGeometry(params.radius || 0.2, params.detail || 0);
                case 'ring': return new THREE.RingGeometry(params.innerRadius ?? 0.1, params.outerRadius ?? 0.22, params.thetaSegments || 24);
                case 'plane': return new THREE.PlaneGeometry(params.width || 0.3, params.height || 0.3);
                case 'air': return new THREE.BoxGeometry(params.width || 0.3, params.height || 0.3, params.depth || 0.3);
                default: return new THREE.BoxGeometry(0.2, 0.2, 0.2);
            }
        }

        function createCustomPartMaterial(partData, pieceParams) {
            const resolvedColor = partData.color || pieceParams.color || '#f5f0e1';
            return new THREE.MeshStandardMaterial({
                color: resolvedColor,
                roughness: partData.roughness ?? 0.5,
                metalness: partData.metalness ?? 0.2,
            });
        }

        // ============================================================
        //  4. 更新場景
        // ============================================================
        function rebuildAllPieces() {
            if (transformControls) transformControls.detach();

            for (const key of PIECE_TYPES) {
                if (pieceGroups[key]) {
                    scene.remove(pieceGroups[key]);
                    pieceGroups[key] = null;
                }
            }
            for (const type of PIECE_TYPES) {
                const params = currentParams[type];
                const pos = params.position || { x: 0, y: 0, z: 0 };
                const group = buildPiece(type, params, params.parts || {});
                group.position.set(pos.x, pos.y, pos.z);
                scene.add(group);
                pieceGroups[type] = group;
            }
            updatePartsListUI();
            if (selectedPart) {
                highlightPart(selectedPart.type, selectedPart.partId);
                attachGizmo();
            }
        }

        let csgDebounceTimer = null;
        function scheduleCSGRebuild() {
            if (csgDebounceTimer) clearTimeout(csgDebounceTimer);
            csgDebounceTimer = setTimeout(() => {
                if (selectedPart) {
                    rebuildSinglePiece(selectedPart.type);
                }
            }, 60);
        }

        function rebuildSinglePiece(type) {
            const params = currentParams[type];
            if (!params) return;

            const oldGroup = pieceGroups[type];
            const pos = params.position || { x: 0, y: 0, z: 0 };

            if (selectedPart && selectedPart.type === type && transformControls) {
                transformControls.detach();
            }

            if (oldGroup) {
                scene.remove(oldGroup);
                oldGroup.traverse(child => {
                    if (child.geometry) child.geometry.dispose();
                    if (child.material) {
                        if (Array.isArray(child.material)) child.material.forEach(m => m.dispose());
                        else child.material.dispose();
                    }
                });
            }

            const newGroup = buildPiece(type, params, params.parts || {});
            newGroup.position.set(pos.x, pos.y, pos.z);
            scene.add(newGroup);
            pieceGroups[type] = newGroup;

            if (selectedPart && selectedPart.type === type) {
                highlightPart(type, selectedPart.partId);
                attachGizmo();
            }
            updatePartsListUI();
        }

        // ============================================================
        //  5. UI 輔助工具
        // ============================================================
        function decimalsFor(step) {
            return step < 0.01 ? 3 : 2;
        }

        function rangeRow(label, id, value, min, max, step) {
            const v = Number(value);
            const dec = decimalsFor(step);
            const shown = isNaN(v) ? (0).toFixed(dec) : v.toFixed(dec);
            return `
              <div class="param-group">
                <div class="param-label">
                  <span>${label}</span>
                  <input type="number" class="num-input" id="${id}_num" min="${min}" max="${max}" step="${step}" value="${shown}">
                </div>
                <input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${isNaN(v) ? 0 : v}">
              </div>`;
        }

        function debounce(fn, ms) {
            let t = null;
            return function (...args) {
                clearTimeout(t);
                t = setTimeout(() => fn.apply(this, args), ms);
            };
        }

        function bindRange(id, onChange, opts = {}) {
            const range = document.getElementById(id);
            const num = document.getElementById(id + '_num');
            if (!range) return;
            const step = parseFloat(range.step) || 0.01;
            const dec = decimalsFor(step);
            const pushDebounced = debounce(() => {
                if (!opts.noHistory) pushHistory();
            }, 300);

            range.addEventListener('input', () => {
                const v = parseFloat(range.value);
                if (num) num.value = v.toFixed(dec);
                onChange(v);
                pushDebounced();      // ← only pushes after 300 ms of quiet
            });

            if (!num) return;

            const commit = () => {
                let v = parseFloat(num.value);
                const min = parseFloat(range.min);
                const max = parseFloat(range.max);
                if (isNaN(v)) { num.value = parseFloat(range.value).toFixed(dec); return; }
                v = Math.min(max, Math.max(min, v));
                range.value = v;
                num.value = v.toFixed(dec);
                onChange(v);
                if (!opts.noHistory) pushHistory();
            };

            num.addEventListener('change', commit);
            num.addEventListener('blur', commit);
            num.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { commit(); num.blur(); }
            });
        }

        function getRangeVal(id, fallback = 0) {
            const el = document.getElementById(id);
            if (!el) return fallback;
            const v = parseFloat(el.value);
            return isNaN(v) ? fallback : v;
        }

        function writePartTransform(type, partId, mesh) {
            const params = currentParams[type];
            if (!params.parts) params.parts = {};
            const pd = params.parts[partId] || (params.parts[partId] = {});
            const r4 = (v) => Math.round(v * 10000) / 10000;
            pd.position = { x: r4(mesh.position.x), y: r4(mesh.position.y), z: r4(mesh.position.z) };
            pd.rotation = { x: r4(mesh.rotation.x), y: r4(mesh.rotation.y), z: r4(mesh.rotation.z) };
            pd.scale = { x: r4(mesh.scale.x), y: r4(mesh.scale.y), z: r4(mesh.scale.z) };
        }

        function syncPartInputs(type) {
            if (!selectedPart || selectedPart.type !== type) return;
            const mesh = getPartMesh(type, selectedPart.partId);
            if (!mesh) return;

            const setVal = (id, v) => {
                const range = document.getElementById(id);
                const num = document.getElementById(id + '_num');
                if (!range) return;
                const dec = decimalsFor(parseFloat(range.step) || 0.01);
                range.value = v;
                if (num) num.value = Number(v).toFixed(dec);
            };

            setVal(`partX_${type}`, mesh.position.x);
            setVal(`partY_${type}`, mesh.position.y);
            setVal(`partZ_${type}`, mesh.position.z);
            setVal(`partRX_${type}`, mesh.rotation.x);
            setVal(`partRY_${type}`, mesh.rotation.y);
            setVal(`partRZ_${type}`, mesh.rotation.z);
            setVal(`partSX_${type}`, mesh.scale.x);
            setVal(`partSY_${type}`, mesh.scale.y);
            setVal(`partSZ_${type}`, mesh.scale.z);
        }

        function syncAirOutline(mesh) {
            const outline = mesh && mesh.userData && mesh.userData.airOutline;
            if (!outline) return;
            outline.position.copy(mesh.position);
            outline.rotation.copy(mesh.rotation);
            outline.scale.copy(mesh.scale);
        }

        //  6. 面板UI生成
        // ============================================================

                  ${rangeRow('SY', `partSY_${type}`, 1, 0.05, 4, 0.01)}
